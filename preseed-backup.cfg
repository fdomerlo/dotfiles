# ==============================================================================
# preseed-backup.cfg - Debian Stable Server - Pull-Backup desde Proxmox (SSH)
# ==============================================================================
# Uso: reemplazar estos placeholders en una copia local antes de instalar:
#   - <ADMIN_SUBNET>         (opcional: CIDR permitido para SSH y Cockpit, ej. 192.168.1.0/24)
#   - <PASSWORD_HASH_SHA512> (generado con: openssl passwd -6)
#   - <ADMIN_SSH_PUBKEY>     (clave pública SSH para fdomerlo, ej. ssh-ed25519 AAAA...)
#   - <PROXMOX_HOST>, <PROXMOX_USER>, <PROXMOX_DUMP_DIR> (ej. /var/lib/vz/dump)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Detección Segura de Disco de SO (Deja discos secundarios intactos)
# ------------------------------------------------------------------------------
# Selecciona el disco fijo más pequeño >= 8 GiB (NVMe/VirtIO/SATA/eMMC),
# excluyendo medios USB, removibles y particiones boot/rpmb de eMMC.
# Así preserva los discos grandes destinados a /srv/backups.
# Para fijar un disco concreto (ej. dos discos iguales), reemplazá esta lógica
# por: debconf-set partman-auto/disk /dev/disk/by-id/... y grub-installer/bootdev.
d-i partman/early_command string \
    BEST=""; BEST_SZ=0; \
    for p in /sys/block/nvme* /sys/block/vd* /sys/block/sd* /sys/block/mmcblk*; do \
        [ -e "$p/size" ] || continue; \
        name=$(basename "$p"); \
        case "$name" in *boot*|*rpmb*) continue ;; esac; \
        [ "$(cat "$p/removable" 2>/dev/null || echo 0)" = "1" ] && continue; \
        readlink -f "$p/device" 2>/dev/null | grep -qi usb && continue; \
        sz=$(cat "$p/size" 2>/dev/null || echo 0); \
        [ "$sz" -ge 16777216 ] || continue; \
        if [ -z "$BEST" ] || [ "$sz" -lt "$BEST_SZ" ]; then \
            BEST="/dev/$name"; BEST_SZ="$sz"; \
        fi; \
    done; \
    if [ -n "$BEST" ]; then \
        debconf-set partman-auto/disk "$BEST"; \
        debconf-set grub-installer/bootdev "$BEST"; \
    fi

# ------------------------------------------------------------------------------
# 2. Localización, Reloj y Hardware
# ------------------------------------------------------------------------------
d-i debian-installer/locale string es_AR.UTF-8
d-i keyboard-configuration/xkb-keymap select latam
d-i console-setup/ask_detect boolean false
d-i hw-detect/load_firmware boolean true

d-i clock-setup/utc boolean true
d-i time/zone string America/Argentina/Buenos_Aires
d-i clock-setup/ntp boolean true

# ------------------------------------------------------------------------------
# 3. Red Ethernet por DHCP (VLAN interna; luego fijar IP por reserva o static)
# ------------------------------------------------------------------------------
d-i netcfg/enable boolean true
d-i netcfg/choose_interface select auto
d-i netcfg/link_wait_timeout string 15
d-i netcfg/dhcp_timeout string 30

# Referencia opcional para IP estática directa durante la instalación:
# d-i netcfg/disable_autoconfig boolean true
# d-i netcfg/disable_dhcp boolean true
# d-i netcfg/get_ipaddress string <SERVER_IP>
# d-i netcfg/get_netmask string <SERVER_NETMASK>
# d-i netcfg/get_gateway string <SERVER_GATEWAY>
# d-i netcfg/get_nameservers string <SERVER_DNS>
# d-i netcfg/confirm_static boolean true

d-i netcfg/get_hostname string backup-server
d-i netcfg/get_domain string local

# ------------------------------------------------------------------------------
# 4. Espejos y Componentes APT
# ------------------------------------------------------------------------------
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/suite string stable

d-i apt-setup/contrib boolean true
d-i apt-setup/non-free boolean true
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/services-select multiselect security, updates

# ------------------------------------------------------------------------------
# 5. Particionado: GPT Híbrido (BIOS-GRUB + EFI) + Raíz EXT4 (sin partición swap)
# ------------------------------------------------------------------------------
d-i partman-auto/method string regular
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman-partitioning/choose_label string gpt
d-i partman-partitioning/default_label string gpt

d-i partman-auto/choose_recipe select server-hybrid-gpt
d-i partman-auto/expert_recipe string \
    server-hybrid-gpt :: \
        1 1 1 free \
            $gptonly{ } $primary{ } $bios_boot{ } \
            method{ biosgrub } . \
        512 512 512 fat32 \
            $primary{ } $iflabel{ gpt } $reusemethod{ } \
            method{ efi } format{ } . \
        8000 10000 -1 ext4 \
            $primary{ } method{ format } format{ } \
            use_filesystem{ } filesystem{ ext4 } mountpoint{ / } .

d-i partman-basicfilesystems/no_swap boolean false
d-i partman-efi/non_efi_system boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman/mount_style select uuid

d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false
d-i grub-installer/force-efi-extra-removable boolean true

# ------------------------------------------------------------------------------
# 6. Cuentas y Privilegios
# ------------------------------------------------------------------------------
d-i passwd/root-login boolean false
d-i passwd/user-fullname string Fernando Merlo
d-i passwd/username string fdomerlo
d-i passwd/user-password-crypted password <PASSWORD_HASH_SHA512>

# ------------------------------------------------------------------------------
# 7. Selección de Paquetes (Server Minimal + Storage + Seguridad + Pull-Backup)
# ------------------------------------------------------------------------------
tasksel tasksel/first multiselect standard
d-i pkgsel/include string \
    openssh-server sudo ca-certificates curl rsync jq tmux vim-tiny zstd \
    cockpit-ws cockpit-system cockpit-storaged udisks2-lvm2 udisks2-btrfs mdadm \
    nftables fail2ban python3-systemd unattended-upgrades apt-listchanges \
    smartmontools lvm2 parted gdisk xfsprogs btrfs-progs hdparm lm-sensors \
    systemd-zram-generator systemd-timesyncd \
    amd64-microcode intel-microcode \
    firmware-linux-nonfree firmware-realtek firmware-misc-nonfree
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false

# ------------------------------------------------------------------------------
# 8. Late Command: Endurecimiento, zRAM/Swap, Pull-Backup SSH y Timer Systemd
# ------------------------------------------------------------------------------
d-i preseed/late_command string \
    sed -i 's/errors=remount-ro/noatime,commit=60,errors=remount-ro/' /target/etc/fstab; \
    printf '%s\n' '[zram0]' 'zram-size = min(ram / 2, 4096)' 'compression-algorithm = zstd' 'swap-priority = 100' 'fs-type = swap' > /target/etc/systemd/zram-generator.conf; \
    SWAP_GIB=$(awk '/MemTotal:/ {gb=int(($2+1048575)/1048576); if (gb<2) gb=2; if (gb>4) gb=4; print gb}' /proc/meminfo); \
    in-target fallocate -l ${SWAP_GIB}G /swapfile; \
    in-target chmod 600 /swapfile; \
    in-target mkswap /swapfile; \
    printf '%s\n' '/swapfile none swap defaults,pri=10 0 0' >> /target/etc/fstab; \
    printf '%s\n' 'vm.swappiness = 60' 'vm.page-cluster = 0' 'net.ipv4.tcp_syncookies = 1' 'net.ipv4.conf.all.rp_filter = 1' 'net.ipv4.conf.default.rp_filter = 1' 'net.ipv4.conf.all.accept_redirects = 0' 'net.ipv4.conf.default.accept_redirects = 0' 'net.ipv6.conf.all.accept_redirects = 0' 'net.ipv6.conf.default.accept_redirects = 0' 'net.ipv4.ip_forward = 0' > /target/etc/sysctl.d/99-backup-server.conf; \
    ADMIN_KEY='<ADMIN_SSH_PUBKEY>'; \
    PASS_AUTH="yes"; \
    case "$ADMIN_KEY" in ssh-*|sk-*) mkdir -p /target/home/fdomerlo/.ssh; printf '%s\n' "$ADMIN_KEY" > /target/home/fdomerlo/.ssh/authorized_keys; chmod 700 /target/home/fdomerlo/.ssh; chmod 600 /target/home/fdomerlo/.ssh/authorized_keys; in-target chown -R fdomerlo:fdomerlo /home/fdomerlo/.ssh; PASS_AUTH="no" ;; esac; \
    mkdir -p /target/etc/ssh/sshd_config.d; \
    printf '%s\n' 'PermitRootLogin no' "PasswordAuthentication $PASS_AUTH" 'PubkeyAuthentication yes' 'KbdInteractiveAuthentication no' 'X11Forwarding no' 'AllowTcpForwarding local' 'AllowAgentForwarding no' 'MaxAuthTries 3' 'LoginGraceTime 30' 'AllowUsers fdomerlo' > /target/etc/ssh/sshd_config.d/99-hardening.conf; \
    ADMIN_SUBNET='<ADMIN_SUBNET>'; \
    case "$ADMIN_SUBNET" in ""|"<"*) SSH_NFT_RULE="tcp dport 22 ct state new limit rate 6/minute burst 10 packets accept"; COCKPIT_NFT_RULE="tcp dport 9090 ct state new limit rate 20/minute burst 40 packets accept" ;; *) SSH_NFT_RULE="ip saddr $ADMIN_SUBNET tcp dport 22 ct state new limit rate 6/minute burst 10 packets accept"; COCKPIT_NFT_RULE="ip saddr $ADMIN_SUBNET tcp dport 9090 ct state new limit rate 20/minute burst 40 packets accept" ;; esac; \
    printf '%s\n' '#!/usr/sbin/nft -f' 'flush ruleset' 'table inet filter {' '    chain input {' '        type filter hook input priority filter; policy drop;' '        iifname "lo" accept' '        ct state established,related accept' '        ct state invalid drop' '        ip protocol icmp icmp type { echo-request, destination-unreachable, time-exceeded } limit rate 10/second accept' '        ip6 nexthdr ipv6-icmp icmpv6 type { echo-request, destination-unreachable, packet-too-big, time-exceeded, parameter-problem, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } limit rate 10/second accept' "        $SSH_NFT_RULE" "        $COCKPIT_NFT_RULE" '    }' '    chain forward {' '        type filter hook forward priority filter; policy drop;' '    }' '    chain output {' '        type filter hook output priority filter; policy accept;' '    }' '}' > /target/etc/nftables.conf; \
    mkdir -p /target/etc/cockpit; \
    printf '%s\n' '[Session]' 'IdleTimeout=15' '' '[WebService]' 'AllowUnencrypted=false' > /target/etc/cockpit/cockpit.conf; \
    printf '%s\n' 'root' 'backup-pull' > /target/etc/cockpit/disallowed-users; \
    printf '%s\n' '[DEFAULT]' 'backend = systemd' 'banaction = nftables-multiport' 'bantime = 1h' 'findtime = 10m' 'maxretry = 5' '' '[sshd]' 'enabled = true' > /target/etc/fail2ban/jail.local; \
    printf '%s\n' 'APT::Periodic::Update-Package-Lists "1";' 'APT::Periodic::Unattended-Upgrade "1";' 'APT::Periodic::AutocleanInterval "7";' > /target/etc/apt/apt.conf.d/20auto-upgrades; \
    printf '%s\n' 'Unattended-Upgrade::Automatic-Reboot "false";' 'Unattended-Upgrade::Remove-Unused-Dependencies "true";' > /target/etc/apt/apt.conf.d/51unattended-upgrades-local; \
    in-target useradd --system --create-home --home-dir /var/lib/backup-pull --shell /usr/sbin/nologin --comment "Proxmox Pull Backup" backup-pull; \
    mkdir -p /target/var/lib/backup-pull/.ssh /target/srv/backups; \
    chmod 700 /target/var/lib/backup-pull/.ssh; \
    in-target ssh-keygen -t ed25519 -N "" -C "backup-pull@backup-server" -f /var/lib/backup-pull/.ssh/id_ed25519; \
    : > /target/var/lib/backup-pull/.ssh/known_hosts; \
    chmod 644 /target/var/lib/backup-pull/.ssh/known_hosts; \
    in-target chown -R backup-pull:backup-pull /var/lib/backup-pull/.ssh /srv/backups; \
    chmod 750 /target/srv/backups; \
    printf '%s\n' 'PROXMOX_HOST="<PROXMOX_HOST>"' 'PROXMOX_SSH_PORT="22"' 'PROXMOX_USER="<PROXMOX_USER>"' 'PROXMOX_DUMP_DIR="<PROXMOX_DUMP_DIR>"' 'BACKUP_ROOT="/srv/backups"' 'BACKUP_SUBDIR="proxmox"' 'SSH_KEY="/var/lib/backup-pull/.ssh/id_ed25519"' 'SSH_KNOWN_HOSTS="/var/lib/backup-pull/.ssh/known_hosts"' 'REQUIRE_MOUNTPOINT="true"' 'MAX_DISK_USAGE_PCT="85"' 'VERIFY_INTEGRITY="true"' 'BWLIMIT_KBPS="0"' 'RETENTION_DAYS="30"' 'MIN_KEEP_ARCHIVES="3"' 'STATUS_FILE="/var/lib/proxmox-pull-backup/last-status.txt"' > /target/etc/proxmox-pull-backup.conf; \
    chmod 640 /target/etc/proxmox-pull-backup.conf; \
    in-target chown root:backup-pull /etc/proxmox-pull-backup.conf; \
    mkdir -p /target/var/lib/proxmox-pull-backup; \
    in-target chown backup-pull:backup-pull /var/lib/proxmox-pull-backup; \
    printf '%s\n' '#!/usr/bin/env bash' 'set -euo pipefail' 'CONF_FILE="/etc/proxmox-pull-backup.conf"' '[ -r "$CONF_FILE" ] || { echo "Error: falta $CONF_FILE" >&2; exit 1; }' 'source "$CONF_FILE"' 'STATUS_FILE="${STATUS_FILE:-${STATE_DIRECTORY:-/var/lib/proxmox-pull-backup}/last-status.txt}"' 'write_status() {' '    local state="$1" detail="$2" disk_pct="${3:-desconocido}"' '    mkdir -p "$(dirname "$STATUS_FILE")" 2>/dev/null || true' '    printf "%s | estado=%s | uso_disco=%s | %s\n" "$(date "+%Y-%m-%d %H:%M:%S")" "$state" "$disk_pct" "$detail" > "$STATUS_FILE" 2>/dev/null || true' '}' 'for var in PROXMOX_HOST PROXMOX_USER PROXMOX_DUMP_DIR; do' '    val="${!var:-}"' '    if [ -z "$val" ] || [[ "$val" == *"<"* ]]; then' '        write_status "ERROR_CONFIG" "Falta configurar $var en $CONF_FILE"' '        echo "Error: configura $var en $CONF_FILE antes de ejecutar" >&2' '        exit 1' '    fi' 'done' 'if [ ! -r "$SSH_KEY" ]; then' '    write_status "ERROR_SSH" "No existe clave $SSH_KEY"' '    echo "Error: no existe la clave $SSH_KEY" >&2' '    exit 1' 'fi' 'if [ ! -s "$SSH_KNOWN_HOSTS" ]; then' '    write_status "ERROR_SSH" "Falta huella del host en $SSH_KNOWN_HOSTS"' '    echo "Error: $SSH_KNOWN_HOSTS vacio. Ejecuta: ssh-keyscan -p $PROXMOX_SSH_PORT -H $PROXMOX_HOST >> $SSH_KNOWN_HOSTS" >&2' '    exit 1' 'fi' 'if [ "${REQUIRE_MOUNTPOINT:-true}" = "true" ] && ! mountpoint -q "$BACKUP_ROOT"; then' '    write_status "ERROR_MONTAJE" "$BACKUP_ROOT no esta montado"' '    echo "Error: $BACKUP_ROOT no es un punto de montaje activo" >&2' '    exit 1' 'fi' 'used_pct=$(df --output=pcent "$BACKUP_ROOT" | tail -n 1 | tr -dc "0-9")' 'max_pct="${MAX_DISK_USAGE_PCT:-85}"' 'if [ "${used_pct:-100}" -ge "$max_pct" ]; then' '    write_status "ALERTA_DISCO" "Uso ${used_pct}% >= limite ${max_pct}%; pull abortado" "${used_pct}%"' '    echo "Error: $BACKUP_ROOT al ${used_pct}% (>= ${max_pct}%). Pull abortado para evitar corrupcion." >&2' '    exit 1' 'fi' 'LOCK_FILE="${RUNTIME_DIRECTORY:-/tmp}/proxmox-pull-backup.lock"' 'exec 9>"$LOCK_FILE"' 'flock -n 9 || { echo "Otro respaldo ya esta en ejecucion" >&2; exit 1; }' 'DEST_DIR="${BACKUP_ROOT%/}/${BACKUP_SUBDIR}"' 'mkdir -p "$DEST_DIR"' 'SSH_CMD="ssh -i $SSH_KEY -p $PROXMOX_SSH_PORT -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$SSH_KNOWN_HOSTS -o IdentitiesOnly=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=3"' 'RSYNC_OPTS=(-aH --stats --human-readable --partial --ignore-existing --no-perms --no-owner --no-group --chmod=D750,F640 --exclude="*.tmp" --exclude="*.dat" --exclude="*.partial")' 'if [ "${BWLIMIT_KBPS:-0}" -gt 0 ]; then' '    RSYNC_OPTS+=("--bwlimit=${BWLIMIT_KBPS}")' 'fi' 'SRC_DIR="${PROXMOX_DUMP_DIR%/}/"' 'rc=0' 'rsync "${RSYNC_OPTS[@]}" -e "$SSH_CMD" "${PROXMOX_USER}@${PROXMOX_HOST}:${SRC_DIR}" "${DEST_DIR}/" || rc=$?' 'if [ "$rc" -ne 0 ] && [ "$rc" -ne 24 ]; then' '    write_status "ERROR_RSYNC" "rsync finalizo con codigo $rc" "${used_pct}%"' '    echo "Error: rsync finalizo con codigo $rc" >&2' '    exit "$rc"' 'fi' 'verified_count=0' 'verify_fail=0' 'fail_list=""' 'if [ "${VERIFY_INTEGRITY:-true}" = "true" ]; then' '    while IFS= read -r -d "" f; do' '        case "$f" in' '            *.zst) if zstd -tq -- "$f"; then verified_count=$((verified_count + 1)); else verify_fail=$((verify_fail + 1)); fail_list="$fail_list $(basename "$f")"; fi ;;' '            *.gz|*.tgz) if gzip -tq -- "$f"; then verified_count=$((verified_count + 1)); else verify_fail=$((verify_fail + 1)); fail_list="$fail_list $(basename "$f")"; fi ;;' '            *.sha256) if (cd "$(dirname "$f")" && sha256sum -c --status "$(basename "$f")"); then verified_count=$((verified_count + 1)); else verify_fail=$((verify_fail + 1)); fail_list="$fail_list $(basename "$f")"; fi ;;' '        esac' '    done < <(find "$DEST_DIR" -maxdepth 2 -type f -mtime -1 \( -name "*.zst" -o -name "*.gz" -o -name "*.tgz" -o -name "*.sha256" \) -print0)' '    if [ "$verify_fail" -gt 0 ]; then' '        write_status "ERROR_INTEGRIDAD" "Fallaron ${verify_fail} archivo(s):${fail_list}" "${used_pct}%"' '        echo "Error de integridad en:${fail_list}" >&2' '        exit 1' '    fi' 'fi' 'if [ "${RETENTION_DAYS:-0}" -gt 0 ]; then' '    mapfile -t archives < <(find "$DEST_DIR" -maxdepth 2 -type f \( -name "*.vma*" -o -name "*.tar*" \) ! -name "*.notes" -printf "%T@ %p\n" | sort -rn | cut -d" " -f2-)' '    keep="${MIN_KEEP_ARCHIVES:-3}"' '    now_epoch=$(date +%s)' '    max_age=$((RETENTION_DAYS * 86400))' '    idx=0' '    for f in "${archives[@]}"; do' '        idx=$((idx + 1))' '        if [ "$idx" -le "$keep" ]; then' '            continue' '        fi' '        mtime=$(stat -c %Y "$f" 2>/dev/null || echo "$now_epoch")' '        if [ $((now_epoch - mtime)) -gt "$max_age" ]; then' '            base="${f%%.vma*}"' '            base="${base%%.tar*}"' '            rm -f -- "$f" "${f}.notes" "${f}.log" "${base}.log"' '        fi' '    done' 'fi' 'used_pct_after=$(df --output=pcent "$BACKUP_ROOT" | tail -n 1 | tr -dc "0-9")' 'free_h=$(df -h --output=avail "$BACKUP_ROOT" | tail -n 1 | xargs)' 'write_status "OK" "verificados=${verified_count} libre=${free_h} destino=${DEST_DIR}" "${used_pct_after}%"' 'echo "Pull-backup completado: verificados=${verified_count}, uso=${used_pct_after}%, libre=${free_h}, destino=${DEST_DIR}"' > /target/usr/local/sbin/proxmox-pull-backup.sh; \
    chmod 755 /target/usr/local/sbin/proxmox-pull-backup.sh; \
    in-target chown root:root /usr/local/sbin/proxmox-pull-backup.sh; \
    printf '%s\n' '[Unit]' 'Description=Pull de backups Proxmox VE sobre SSH' 'After=network-online.target' 'Wants=network-online.target' '' '[Service]' 'Type=oneshot' 'User=backup-pull' 'Group=backup-pull' 'RuntimeDirectory=proxmox-pull-backup' 'RuntimeDirectoryMode=0750' 'StateDirectory=proxmox-pull-backup' 'StateDirectoryMode=0750' 'ExecStart=/usr/local/sbin/proxmox-pull-backup.sh' 'Nice=10' 'IOSchedulingClass=idle' 'NoNewPrivileges=true' 'PrivateTmp=true' 'ProtectSystem=strict' 'ProtectHome=true' 'ProtectKernelTunables=true' 'ProtectKernelModules=true' 'ProtectControlGroups=true' 'ReadWritePaths=/srv/backups' '' '[Install]' 'WantedBy=multi-user.target' > /target/etc/systemd/system/proxmox-pull-backup.service; \
    printf '%s\n' '[Unit]' 'Description=Ejecucion diaria diurna de pull-backup Proxmox VE' '' '[Timer]' 'OnCalendar=*-*-* 10:00:00' 'RandomizedDelaySec=10m' 'Persistent=true' '' '[Install]' 'WantedBy=timers.target' > /target/etc/systemd/system/proxmox-pull-backup.timer; \
    mkdir -p /target/etc/update-motd.d; \
    printf '%s\n' '#!/bin/sh' 'STATUS_FILE="/var/lib/proxmox-pull-backup/last-status.txt"' 'echo ""' 'if [ -r "$STATUS_FILE" ]; then' '    echo "Ultimo pull-backup: $(cat "$STATUS_FILE")"' 'else' '    echo "Ultimo pull-backup: sin ejecuciones registradas"' 'fi' 'if mountpoint -q /srv/backups 2>/dev/null; then' '    echo "Espacio /srv/backups: $(df -h --output=used,avail,pcent /srv/backups | tail -n 1 | xargs)"' 'fi' > /target/etc/update-motd.d/99-backup-status; \
    chmod 755 /target/etc/update-motd.d/99-backup-status; \
    printf '%s\n' '====================================================================' ' Debian Pull-Backup Server - Checklist Post-Instalacion' '====================================================================' '1. Fijar la IP asignada por la VLAN (reserva DHCP o /etc/network/interfaces).' '   Cockpit Web: https://<IP_DEL_SERVIDOR>:9090 (usuario fdomerlo)' '2. Montar el disco de datos en /srv/backups (/etc/fstab) y ajustar:' '   sudo chown backup-pull:backup-pull /srv/backups' '3. Copiar la clave publica de /var/lib/backup-pull/.ssh/id_ed25519.pub' '   al Proxmox (~/.ssh/authorized_keys del usuario de respaldo) con:' '   restrict,command="rrsync -ro /var/lib/vz/dump"' '4. Registrar la huella SSH del nodo Proxmox:' '   sudo -u backup-pull ssh-keyscan -H <PROXMOX_HOST> | sudo -u backup-pull tee -a /var/lib/backup-pull/.ssh/known_hosts' '5. Revisar /etc/proxmox-pull-backup.conf, probar ejecucion manual:' '   sudo systemctl start proxmox-pull-backup.service' '   y habilitar el timer diario:' '   sudo systemctl enable --now proxmox-pull-backup.timer' > /target/etc/motd; \
    if [ "$PASS_AUTH" = "yes" ]; then printf '%s\n' 'AVISO: PasswordAuthentication quedo activo (falta <ADMIN_SSH_PUBKEY>).' >> /target/etc/motd; fi; \
    case "$ADMIN_SUBNET" in ""|"<"*) printf '%s\n' 'AVISO: SSH tcp/22 y Cockpit tcp/9090 abiertos sin restriccion de subred (falta <ADMIN_SUBNET>).' >> /target/etc/motd ;; esac; \
    printf '%s\n' '====================================================================' >> /target/etc/motd; \
    in-target systemctl enable fstrim.timer nftables fail2ban unattended-upgrades systemd-timesyncd cockpit.socket

# ------------------------------------------------------------------------------
# 9. Finalización Silenciosa
# ------------------------------------------------------------------------------
d-i cdrom-detect/eject boolean true
d-i finish-install/reboot_in_progress note
