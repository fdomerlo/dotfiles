# ==============================================================================
# preseed.cfg - Debian Testing - Perfil de Ingeniería
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Detección Temprana y Selección Dinámica de Disco (NVMe, VirtIO, SATA, eMMC)
# ------------------------------------------------------------------------------
# Prioriza el almacenamiento primario más rápido y seguro: NVMe -> VirtIO (VMs) -> SATA -> eMMC.
# Evita seleccionar medios USB de instalación (/dev/sdb+) y excluye particiones individuales.
d-i partman/early_command string \
    DISK=$(ls -1 /dev/nvme[0-9]*n1 /dev/sda /dev/vda /dev/mmcblk0 2>/dev/null | head -n 1); \
    if [ -n "$DISK" ]; then debconf-set partman-auto/disk "$DISK"; fi

# ------------------------------------------------------------------------------
# 2. Localización y Hardware
# ------------------------------------------------------------------------------
d-i debian-installer/locale string es_AR.UTF-8
d-i keyboard-configuration/xkb-keymap select latam
d-i console-setup/ask_detect boolean false
d-i hw-detect/load_firmware boolean true

# ------------------------------------------------------------------------------
# 3. Red (Configuración Wi-Fi WPA/WPA2)
# ------------------------------------------------------------------------------
# Selección de interfaz: 'auto' intenta conectar a la primera que tenga enlace.
# Si el instalador insiste en buscar cable Ethernet no conectado, podés forzar la placa Wi-Fi
# especificando su nombre (ej: wlan0 o wlp3s0 en vez de auto):
d-i netcfg/choose_interface select auto

# Tiempo de espera para que la placa levante enlace (los chips Wi-Fi tardan más que Ethernet)
d-i netcfg/link_wait_timeout string 20

# Parámetros de la red Wi-Fi (Reemplazar placeholders antes de inyectar en ISO/initrd)
d-i netcfg/wireless_show_essids select manual
d-i netcfg/wireless_essid string <WIFI_SSID>
d-i netcfg/wireless_security_type select wpa
d-i netcfg/wireless_wpa string <WIFI_PASSWORD>

# Hostname y dominio
d-i netcfg/get_hostname string dev-workstation
d-i netcfg/get_domain string local

# ------------------------------------------------------------------------------
# 4. Espejos y Componentes
# ------------------------------------------------------------------------------
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
# Suite de instalación: Debian Testing
d-i mirror/suite string testing

d-i apt-setup/contrib boolean true
d-i apt-setup/non-free boolean true
d-i apt-setup/non-free-firmware boolean true
# Solo security y updates en la base inicial
d-i apt-setup/services-select multiselect security, updates

# ------------------------------------------------------------------------------
# 5. Particionado: GPT + EFI + Raíz EXT4 Monolítica (sin swap en partición)
# ------------------------------------------------------------------------------
d-i partman-auto/method string regular
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman-partitioning/choose_label string gpt
d-i partman-partitioning/default_label string gpt

# Receta plana: 1GB EFI (Future-proof systemd-boot/UKI) + Resto EXT4
d-i partman-auto/choose_recipe select custom-flat
d-i partman-auto/expert_recipe string \
    custom-flat :: \
        1024 1024 1024 fat32 \
            $primary{ } $iflabel{ gpt } $reusemethod{ } \
            method{ efi } format{ } . \
        4000 10000 -1 ext4 \
            $primary{ } method{ format } format{ } \
            use_filesystem{ } filesystem{ ext4 } mountpoint{ / } .
            
# Confirmaciones automáticas y supresión del aviso de swap inexistente
d-i partman-basicfilesystems/no_swap boolean false
d-i partman-efi/non_efi_system boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman/mount_style select uuid

# ------------------------------------------------------------------------------
# 6. Cuentas y Privilegios
# ------------------------------------------------------------------------------
d-i passwd/root-login boolean false
d-i passwd/user-fullname string Fernando Merlo
d-i passwd/username string fdomerlo
# Generar un nuevo hash SHA-512 con: openssl passwd -6
d-i passwd/user-password-crypted password <PASSWORD_HASH_SHA512>

# ------------------------------------------------------------------------------
# 7. Selección de Paquetes (Soporte Híbrido PC/Notebooks AMD e Intel)
# ------------------------------------------------------------------------------
tasksel tasksel/first multiselect standard
d-i pkgsel/include string \
    sudo curl git zsh make gnome-core \
    amd64-microcode intel-microcode \
    firmware-linux-nonfree firmware-amd-graphics firmware-misc-nonfree \
    firmware-iwlwifi firmware-realtek firmware-atheros firmware-sof-signed \
    libgl1-mesa-dri mesa-vulkan-drivers intel-media-va-driver \
    systemd-zram-generator build-essential
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false

# ------------------------------------------------------------------------------
# 8. Late Command Definitivo (Sin llamadas de red frágiles y 100% compatible con d-i)
# ------------------------------------------------------------------------------
d-i preseed/late_command string \
    sed -i 's/errors=remount-ro/noatime,commit=60,errors=remount-ro/' /target/etc/fstab; \
    echo '[zram0]' > /target/etc/systemd/zram-generator.conf; \
    echo 'zram-size = ram' >> /target/etc/systemd/zram-generator.conf; \
    echo 'compression-algorithm = zstd' >> /target/etc/systemd/zram-generator.conf; \
    echo 'swap-priority = 100' >> /target/etc/systemd/zram-generator.conf; \
    echo 'fs-type = swap' >> /target/etc/systemd/zram-generator.conf; \
    in-target fallocate -l 4G /swapfile; \
    in-target chmod 600 /swapfile; \
    in-target mkswap /swapfile; \
    echo '/swapfile none swap defaults,pri=10 0 0' >> /target/etc/fstab; \
    echo 'vm.swappiness = 180' > /target/etc/sysctl.d/99-zram.conf; \
    echo 'vm.watermark_boost_factor = 0' >> /target/etc/sysctl.d/99-zram.conf; \
    echo 'vm.watermark_scale_factor = 125' >> /target/etc/sysctl.d/99-zram.conf; \
    echo 'vm.page-cluster = 0' >> /target/etc/sysctl.d/99-zram.conf; \
    in-target systemctl enable fstrim.timer

# ------------------------------------------------------------------------------
# 9. Finalización Silenciosa
# ------------------------------------------------------------------------------
d-i cdrom-detect/eject boolean true
d-i finish-install/reboot_in_progress note
