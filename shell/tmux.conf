# ==============================================================================
# Tmux - Sesiones persistentes con estilo coherente con el escritorio
# ==============================================================================

# Prefix más cómodo que Ctrl+b.
set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 100000
set -g mouse on

# Abrir splits en el directorio actual.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Recargar la configuración sin reiniciar.
bind r source-file ~/.tmux.conf \; display-message "tmux.conf recargado"

# Navegación entre paneles coherente con vim.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Status bar con el acento cyan del escritorio.
set -g status-style "bg=#0c1012,fg=#e6ece8"
set -g status-left "#[fg=#0db7d4,bold] #S #[default]"
set -g status-right "#[fg=#7aa2f7]%H:%M #[default]"
set -g window-status-current-style "fg=#0db7d4,bold"
set -g window-status-style "fg=#91a39a"
set -g pane-border-style "fg=#2a3834"
set -g pane-active-border-style "fg=#0db7d4"
set -g message-style "bg=#0c1012,fg=#e6ece8"
