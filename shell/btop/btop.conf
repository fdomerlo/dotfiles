# ==============================================================================
# btop - Configuración base neutral a los temas de Hyprland
#
# Este archivo se copia una sola vez a ~/.config/btop/btop.conf. btop reescribe
# su configuración al salir, por eso no se enlaza como symlink (evita ensuciar
# el repo). El tema sí se enlaza desde shell/btop/themes/neutral.theme.
# ==============================================================================

# Tema monocromático propio; el fondo hereda el color de la terminal.
color_theme = "neutral"
theme_background = False
truecolor = True
rounded_corners = True
