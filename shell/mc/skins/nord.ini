# Midnight Commander - Nord
#
# Skin truecolor que replica la paleta de `shell/yazi/theme.toml`:
# fondo de la terminal respetado, texto Nord y acentos reservados para
# directorios, tipos de archivo y estados.
#
# Requiere un terminal con truecolor (Foot lo soporta y define
# COLORTERM=truecolor) y que `mc` esté compilado contra S-Lang (Debian sí).

[skin]
    description = Nord (Yazi-compatible)
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[core]
    _default_ = #d8dee9;default
    selected = #2e3440;#88c0d0;bold
    marked = #ebcb8b;;bold
    markselect = #2e3440;#ebcb8b;bold
    gauge = #a3be8c;#3b4252
    input = #2e3440;#88c0d0
    inputunchanged = #4c566a;#88c0d0
    inputmark = #2e3440;#ebcb8b
    disabled = #4c566a;default
    reverse = #2e3440;#d8dee9
    commandlinemark = #2e3440;#ebcb8b
    header = #88c0d0;;bold
    inputhistory =
    commandhistory =
    shadow = #000000;#000000

[dialog]
    _default_ = #d8dee9;#3b4252
    dfocus = #2e3440;#88c0d0
    dhotnormal = #ebcb8b;;underline
    dhotfocus = #2e3440;#88c0d0;underline
    dtitle = #88c0d0;;bold

[error]
    _default_ = #eceff4;#8f3f47
    errdfocus = #2e3440;#ebcb8b
    errdhotnormal = #ebcb8b;#8f3f47;underline
    errdhotfocus = #2e3440;#ebcb8b;underline
    errdtitle = #eceff4;#8f3f47;bold

[filehighlight]
    directory = #88c0d0;;bold
    executable = #a3be8c;
    symlink = #8fbcbb;
    hardlink =
    stalelink = #d16d76;
    device = #b48ead;
    special = #81a1c1;
    core = #d16d76;
    temp = #8394a3;
    archive = #d08770;
    doc = #81a1c1;
    source = #8fbcbb;
    media = #b48ead;
    graph = #ebcb8b;
    database = #d08770;

[menu]
    _default_ = #d8dee9;#3b4252
    menusel = #2e3440;#88c0d0
    menuhot = #ebcb8b;#3b4252;underline
    menuhotsel = #2e3440;#ebcb8b;underline
    menuinactive = #4c566a;default

[popupmenu]
    _default_ = #d8dee9;#3b4252
    menusel = #2e3440;#88c0d0
    menutitle = #88c0d0;#3b4252;bold

[buttonbar]
    hotkey = #ebcb8b;#2e3440
    button = #d8dee9;#3b4252

[statusbar]
    _default_ = #eceff4;#5e81ac

[help]
    _default_ = #d8dee9;#3b4252
    helpbold = #eceff4;#3b4252;bold
    helpitalic = #b48ead;#3b4252;italic
    helplink = #88c0d0;#3b4252;underline
    helpslink = #2e3440;#88c0d0
    helptitle = #88c0d0;#3b4252;bold

[editor]
    _default_ = #d8dee9;default
    editbold = #ebcb8b;default;bold
    editmarked = #2e3440;#88c0d0
    editwhitespace = #4c566a;default
    editnonprintable = #4c566a;default
    editlinestate = #2e3440;#ebcb8b
    bookmark = #2e3440;#a3be8c
    bookmarkfound = #2e3440;#ebcb8b
    editrightmargin = #4c566a;default
    editbg = ;default
    editframe = #4c566a;
    editframeactive = #88c0d0;
    editframedrag = #ebcb8b;

[viewer]
    _default_ = #d8dee9;default
    viewbold = #ebcb8b;default;bold
    viewunderline = #d16d76;default;underline
    viewselected = #2e3440;#88c0d0

[diffviewer]
    added = #a3be8c;#2e3440
    changedline = #2e3440;#ebcb8b
    changednew = #2e3440;#a3be8c
    changed = #2e3440;#81a1c1
    removed = #d16d76;#2e3440
    error = #eceff4;#8f3f47

[widget-panel]
    sort-up-char = ▴
    sort-down-char = ▾
    hiddenfiles-show-char = •
    hiddenfiles-hide-char = ○
    history-prev-item-char = ◂
    history-next-item-char = ▸
    history-show-list-char = ▾
    filename-scroll-left-char = ◂
    filename-scroll-right-char = ▸

[widget-scrollbar]
    first-vert-char = ▴
    last-vert-char = ▾
    first-horiz-char = ◂
    last-horiz-char = ▸
    current-char = ■
    background-char = ▒

[widget-editor]
    window-state-char = ↕
    window-close-char = ✕
