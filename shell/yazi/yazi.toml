# Yazi - configuración general
# Enfoque: navegación tipo GUI dentro de Foot/Hyprland, con tres paneles
# (padre / actual / preview), previews de alta calidad y operaciones con progreso.

[mgr]
# Panel padre estrecho, lista central amplia y preview generosa.
# Reparto horizontal padre/actual/preview: con [1, 4, 5] el preview ocupa la
# mitad del ancho (en 1920 px: ~192 / ~768 / ~960 px). Para más preview usá
# [1, 3, 6]; para recuperar ancho de la lista, [1, 5, 5].
ratio          = [ 2, 3, 5 ]
sort_by        = "alphabetical"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
# "size" muestra el tamaño como en un gestor gráfico; "m m" alterna a fecha.
linemode       = "size"
show_hidden    = false
show_symlink   = true
scrolloff      = 5
mouse_events   = [ "click", "scroll", "drag" ]

[preview]
wrap          = "no"
tab_size      = 2
max_width     = 1000
max_height    = 1000
image_delay   = 30
# lanczos3 + 90 % da bordes limpios y texto legible en capturas y PDF.
image_filter  = "lanczos3"
image_quality = 90

[opener]
# Edición y apertura de carpetas: el primer opener de esta lista es el que
# usa la regla `folder/*`, así que las carpetas se abren como proyecto en Zed.
# Para cambiar la app por defecto, reordená esta lista o usá F4 (abrir con...).
# Zed se lanza vía `sh -c` con ruta absoluta porque Yazi no hereda el PATH del
# login (no incluye ~/.local/bin) y no expande `$HOME` en los openers.
edit = [
    { run = "nano %s", desc = "nano", block = true },
    { run = "sh -c '\"$HOME/.local/bin/zed\" %s'", desc = "Zed", orphan = true },
    { run = "code %s", desc = "VS Code", orphan = true },
    { run = "nvim %s", desc = "Neovim", block = true },
]
# Reproducción y apertura delegadas a visores nativos Wayland (zathura, imv) y xdg-open.
pdf = [
    { run = "zathura %s1", desc = "Zathura (PDF)", orphan = true },
    { run = "xdg-open %s1", desc = "Abrir con la app del sistema", orphan = true },
]
image = [
    { run = "sh -c 'if command -v imv-wayland >/dev/null 2>&1; then imv-wayland \"$@\"; elif [ -x /usr/libexec/imv/imv ]; then /usr/libexec/imv/imv \"$@\"; else xdg-open \"$1\"; fi' -- %s", desc = "imv (Wayland)", orphan = true },
    { run = "swappy -f %s1 -o %s1", desc = "Anotar con Swappy", orphan = true },
    { run = "xdg-open %s1", desc = "Abrir con la app del sistema", orphan = true },
]
play = [
    { run = "xdg-open %s1", desc = "Abrir con la app del sistema", orphan = true },
]
open = [
    { run = "xdg-open %s1", desc = "Abrir con la app del sistema", orphan = true },
]
reveal = [
    { run = "xdg-open %d1", desc = "Abrir carpeta contenedora", orphan = true },
]

[open]
prepend_rules = [
    { mime = "application/pdf", use = [ "pdf", "reveal" ] },
    { mime = "image/*", use = [ "image", "reveal" ] },
]
