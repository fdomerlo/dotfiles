# ==============================================================================
# Hyprlock - Pantalla de bloqueo (Look & Feel PikaOS)
# ==============================================================================

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 6
    contrast = 1.1
    brightness = 0.7
    vibrancy = 0.2
}

input-field {
    monitor =
    size = 320, 54
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(0db7d4ff) rgba(7aa2f7ff) 45deg
    inner_color = rgba(0c1012f0)
    font_color = rgba(e6ece8ff)
    fade_on_empty = false
    placeholder_text = <span foreground="#91a39a">Contraseña...</span>
    hide_input = false
    position = 0, -80
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgba(0db7d4ff)
    font_size = 64
    font_family = JetBrains Mono Bold
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = rgba(72, 215, 176, 1.0)
    font_size = 18
    font_family = JetBrains Mono
    position = 0, -160
    halign = center
    valign = center
}
