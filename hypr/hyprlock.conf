# Pantalla de bloqueo.

background {
    monitor =
    path = screenshot
    blur_passes = 2
    blur_size = 7
    contrast = 1.0
    brightness = 0.8
    vibrancy = 0.2
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(89b4faff)
    inner_color = rgba(1e1e2eff)
    font_color = rgba(cdd6f4ff)
    fade_on_empty = false
    placeholder_text = <span foreground="#cdd6f4">Contraseña...</span>
    hide_input = false
    position = 0, -80
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgba(cdd6f4ff)
    font_size = 64
    font_family = JetBrains Mono
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = rgba(89b4faff)
    font_size = 18
    font_family = JetBrains Mono
    position = 0, -160
    halign = center
    valign = center
}
