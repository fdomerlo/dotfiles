# ==============================================================================
# xdg-desktop-portal - Selección de backends SOLO para la sesión Hyprland
# ==============================================================================
# El archivo se llama hyprland-portals.conf a propósito: xdg-desktop-portal
# busca <desktop>-portals.conf según XDG_CURRENT_DESKTOP. Así, en Hyprland
# (XDG_CURRENT_DESKTOP=Hyprland:GNOME) se usa esta configuración, pero en GNOME
# se usa /usr/share/xdg-desktop-portal/gnome-portals.conf. Un portals.conf
# genérico se aplicaría también a GNOME y rompería sus backends.
#
# XDG_CURRENT_DESKTOP se define como "Hyprland:GNOME" (ver hypr/conf/env.conf)
# para que GTK y los portales de GNOME cubran el file picker y los secretos.
#
# Problema: al incluir "GNOME" en XDG_CURRENT_DESKTOP, xdg-desktop-portal
# resuelve mediante la clave obsoleta UseIn las interfaces que ni hyprland.portal
# ni gtk.portal implementan (Background, Clipboard, RemoteDesktop, Usb y
# Wallpaper), y elige gnome.portal. Ese backend no existe en una sesión
# Hyprland, así que D-Bus espera ~25 s por cada interfaz (más de dos minutos en
# total). Mientras el portal está bloqueado, org.freedesktop.portal.Settings no
# responde y cualquier aplicación GTK que consulte el esquema de color queda
# esperando: Waybar es el caso más visible, arranca pero nunca crea su superficie
# layer-shell, por lo que la barra no aparece.
#
# Solución: fijar los backends de forma explícita y desactivar con "none" las
# interfaces que solo provee GNOME.
[preferred]
default=hyprland;gtk
org.freedesktop.impl.portal.Secret=gnome-keyring
org.freedesktop.impl.portal.Background=none
org.freedesktop.impl.portal.Clipboard=none
org.freedesktop.impl.portal.RemoteDesktop=none
org.freedesktop.impl.portal.Usb=none
org.freedesktop.impl.portal.Wallpaper=none
