# Ciclo automático de energía por inactividad (idéntico en desktop y laptop):
#   5 min        -> bloquear sesión
#   10 min       -> apagar pantalla (DPMS)
#   15 / 20 min  -> suspender (sin corriente / con corriente)
#   30 / 40 min  -> hibernar tras suspensión (systemd suspend-then-hibernate)
#
# Solo el inhibidor Wayland (botón idle_inhibitor de Waybar) anula este ciclo;
# los inhibidores D-Bus/systemd de aplicaciones y navegadores se ignoran.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
    ignore_dbus_inhibit = true
    ignore_systemd_inhibit = true
    ignore_wayland_inhibit = false
}

# 5 min: bloquear sesión
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 10 min: apagar pantalla
listener {
    timeout = 600
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# 15 min (sin corriente / batería): suspender -> hiberna a los 30 min totales
listener {
    timeout = 900
    on-timeout = ~/.config/hypr/scripts/idle-suspend.sh --battery-only
}

# 20 min (con corriente / AC o desktop): suspender -> hiberna a los 40 min totales
listener {
    timeout = 1200
    on-timeout = ~/.config/hypr/scripts/idle-suspend.sh
}
