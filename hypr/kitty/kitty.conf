# ==============================================================================
# Kitty Terminal - Look & Feel PikaOS / Cyber-Teal
# ==============================================================================

# Tipografía
font_family      JetBrains Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# Espaciado interno: margen cómodo para que el contenido no pegue a los bordes
window_padding_width 12

# Comportamiento de ventana
remember_window_size  yes
initial_window_width  920
initial_window_height 560
hide_window_decorations yes
confirm_os_window_close 0

# Cursor Cyber-Teal
cursor                #0db7d4
cursor_text_color     #0c1012
cursor_shape          beam
cursor_blink_interval 0.5

# Esquema de color (Modo Oscuro Cyber-Teal / Deep Slate)
background            #0c1012
foreground            #e6ece8
selection_background  #1e3a40
selection_foreground  #e6ece8
url_color             #0db7d4

# Paleta ANSI equilibrada para modo oscuro
color0  #1b2326
color8  #4a5c60
color1  #f7768e
color9  #f7768e
color2  #73daca
color10 #73daca
color3  #e0af68
color11 #e0af68
color4  #0db7d4
color12 #7aa2f7
color5  #bb9af7
color13 #bb9af7
color6  #7dcfff
color14 #7dcfff
color7  #c0caf5
color15 #ffffff
