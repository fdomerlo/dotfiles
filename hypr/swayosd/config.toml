# ==============================================================================
# SwayOSD - Ajustes comunes a todos los temas.
# El estilo visual (colores, radios y tipografia) vive en
# themes/<tema>/swayosd/style.css y se enlaza como ~/.config/swayosd/style.css.
# ==============================================================================

[server]
# Posicion vertical del OSD (0.5 = centro de la pantalla, 1.0 = borde inferior).
top_margin = 0.85
# Permite sobre-amplificar hasta 150 % (mismo techo que wpctl en osd.sh).
max_volume = 150
# Muestra el porcentaje numerico junto a la barra.
show_percentage = true
