# ==============================================================================
# Paleta Hyprland — Modo Oscuro (Cyber-Teal Material 3)
# ==============================================================================

general {
    col.active_border = rgba(22d3eea8) rgba(7dd3c868) 45deg
    col.inactive_border = rgba(3f535c66)
}

decoration {
    active_opacity = 0.93
    inactive_opacity = 0.85
    fullscreen_opacity = 1.0

    shadow {
        color = rgba(05090ccc)
        color_inactive = rgba(05090c88)
    }

    blur {
        size = 7
        passes = 3
        noise = 0.015
        contrast = 1.15
        brightness = 0.92
        vibrancy = 0.25
        vibrancy_darkness = 0.20
        ignore_opacity = true
        popups = true
    }
}

# Terminales Foot: texto 100 % nítido usando el alpha nativo de foot.ini
windowrule = match:class ^(foot|tui-float|ai-float|scratchpad)$, opacity 1.0 override 0.92 override 1.0 override

# Navegadores: transparencia más sutil para no lavar páginas claras ni imágenes
windowrule = match:class ^(firefox|org\.mozilla\.firefox|firefox-esr|google-chrome|chromium|brave-browser)$, opacity 0.95 override 0.88 override 1.0 override

# Multimedia, juegos y apps sensibles al color: siempre 100 % opacas
windowrule = match:class ^(mpv|vlc|imv|swappy|loupe|org\.gnome\.Loupe|eog|gimp|krita|inkscape|obs|com\.obsproject\.Studio|steam_app_.*)$, opacity 1.0 override 1.0 override 1.0 override
windowrule = match:title ^(Picture-in-Picture)$, opacity 1.0 override 1.0 override 1.0 override
windowrule = match:title .*(YouTube|Twitch|Netflix|Prime Video|Disney\+|Vimeo).*, opacity 1.0 override 1.0 override 1.0 override
