# ==============================================================================
# Fuzzel — Cyber-Teal Material 3 (Modo Oscuro)
# ==============================================================================

[main]
font=Inter:size=11.5
prompt="› "
placeholder=Buscar...
terminal=foot -e
icons-enabled=no
show-actions=no
fields=filename,name,generic,keywords,categories
width=54
lines=12
line-height=24
horizontal-pad=26
vertical-pad=22
inner-pad=14
image-size-ratio=0.6
layer=overlay
keyboard-focus=on-demand
exit-on-keyboard-focus-loss=yes

[colors]
background=0d1317d9
text=e8f1f3ff
prompt=22d3eeff
placeholder=7d9399ff
input=e8f1f3ff
match=7dd3c8ff
selection=0c3c47ff
selection-text=b8f1fbff
selection-match=22d3eeff
counter=7d9399ff
border=22d3eeff

[border]
width=2
radius=20
