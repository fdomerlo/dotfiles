# ==============================================================================
# Hyprlock — Pantalla de bloqueo (Cyber-Teal Material 3 · Modo Oscuro)
# ==============================================================================

$font = JetBrains Mono
$icon_font = Symbols Nerd Font Mono

general {
    hide_cursor = true
    ignore_empty_input = true
    fail_timeout = 2000
}

animations {
    enabled = true
    bezier = m3_decel, 0.05, 0.7, 0.1, 1.0
    animation = fadeIn, 1, 4, m3_decel
    animation = fadeOut, 1, 3, m3_decel
    animation = inputFieldDots, 1, 2, m3_decel
    animation = inputFieldColors, 1, 3, m3_decel
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
    contrast = 1.08
    brightness = 0.42
    vibrancy = 0.18
}

# Círculo exterior del candado
shape {
    monitor =
    size = 136, 136
    color = rgba(0d1317eb)
    rounding = -1
    border_size = 2
    border_color = rgba(22d3eeff) rgba(7dd3c8ff) 45deg
    shadow_passes = 2
    shadow_size = 14
    shadow_color = rgba(05090ccc)
    position = 0, 42
    halign = center
    valign = center
    zindex = 1
}

# Retícula circular interior
shape {
    monitor =
    size = 114, 114
    color = rgba(00000000)
    rounding = -1
    border_size = 1
    border_color = rgba(253339d9)
    position = 0, 42
    halign = center
    valign = center
    zindex = 1
}

# Ícono grande de candado centrado en el círculo
label {
    monitor =
    text = 󰌾
    color = rgba(22d3eeff)
    font_size = 44
    font_family = $icon_font
    position = 0, 43
    halign = center
    valign = center
    zindex = 2
}

# Reloj (usa `date` para respetar /etc/localtime en Debian 13)
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(e8f1f3ff)
    font_size = 64
    font_family = JetBrains Mono Bold
    position = 0, 215
    halign = center
    valign = center
    zindex = 2
}

# Fecha
label {
    monitor =
    text = cmd[update:60000] date +"%a %d %b %Y" | tr '[:lower:]' '[:upper:]'
    color = rgba(22d3eeff)
    font_size = 12
    font_family = $font
    position = 0, 156
    halign = center
    valign = center
    zindex = 2
}

# Etiqueta de estado debajo del candado
label {
    monitor =
    text = SESIÓN BLOQUEADA // PAM ACTIVO
    color = rgba(7d9399ff)
    font_size = 11
    font_family = $font
    position = 0, -52
    halign = center
    valign = center
    zindex = 2
}

# Campo de contraseña
input-field {
    monitor =
    size = 340, 50
    outline_thickness = 2
    rounding = 16
    dots_size = 0.22
    dots_spacing = 0.24
    dots_center = true
    outer_color = rgba(22d3eeff) rgba(7dd3c8ff) 45deg
    inner_color = rgba(121a1ff2)
    font_color = rgba(e8f1f3ff)
    check_color = rgba(7dd3c8ff) rgba(22d3eeff) 45deg
    fail_color = rgba(f38ba8ff)
    capslock_color = rgba(f2c97dff)
    fade_on_empty = false
    font_family = $font
    placeholder_text = Autenticación requerida
    check_text = Verificando credenciales...
    fail_text = Acceso denegado ($ATTEMPTS)
    hide_input = false
    position = 0, -106
    halign = center
    valign = center
    zindex = 2
}

# Usuario y equipo
label {
    monitor =
    text = cmd[update:60000] printf '%s@%s' "$USER" "$(hostname -s)"
    color = rgba(7dd3c8ff)
    font_size = 13
    font_family = $font
    position = 0, -162
    halign = center
    valign = center
    zindex = 2
}

# Telemetría HUD superior izquierda
label {
    monitor =
    text = cmd[update:4000] ~/.config/hypr/scripts/lock-telemetry.sh left
    color = rgba(b5c6cbd9)
    font_size = 11
    font_family = $font
    text_align = left
    position = 28, -24
    halign = left
    valign = top
    zindex = 1
}

# Telemetría HUD superior derecha
label {
    monitor =
    text = cmd[update:4000] ~/.config/hypr/scripts/lock-telemetry.sh right
    color = rgba(b5c6cbd9)
    font_size = 11
    font_family = $font
    text_align = right
    position = -28, -24
    halign = right
    valign = top
    zindex = 1
}

# Stream sutil de monitoreo en vivo en el fondo
label {
    monitor =
    text = cmd[update:2500] ~/.config/hypr/scripts/lock-telemetry.sh stream
    color = rgba(22d3ee59)
    font_size = 10
    font_family = $font
    text_align = left
    position = 28, 22
    halign = left
    valign = bottom
    zindex = -1
}

# Identificador de perfil
label {
    monitor =
    text = CYBER-TEAL M3 // DARK · HYPRLOCK
    color = rgba(7d939999)
    font_size = 10
    font_family = $font
    text_align = right
    position = -28, 22
    halign = right
    valign = bottom
    zindex = -1
}
