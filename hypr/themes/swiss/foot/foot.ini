# ==============================================================================
# Foot Terminal - Swiss
# Terminal claro con paleta editorial: blanco frio, tinta, azul Klein y rojo
# suizo. La monoespaciada se conserva solo donde corresponde: en la terminal.
# ==============================================================================

[main]
font=JetBrains Mono:size=10
pad=12x12 center
initial-window-size-pixels=920x560
resize-delay-ms=50

[scrollback]
lines=10000

[cursor]
style=beam
blink=yes
color=fafaf7 002fa7

[colors]
alpha=1.0
background=fafaf7
foreground=0a0a0a
selection-foreground=0a0a0a
selection-background=dbe4f7
urls=002fa7

# Paleta ANSI editorial: azul Klein, rojo suizo y verdes/ocres oscurecidos
# para conservar contraste sobre blanco.
regular0=0a0a0a
regular1=c81e1e
regular2=1f6f43
regular3=9a6700
regular4=002fa7
regular5=7a2e8e
regular6=1f6f8b
regular7=5f6368

bright0=6b7280
bright1=e03c3c
bright2=2e8a55
bright3=b8860a
bright4=3355c8
bright5=9a4bb0
bright6=2e8aa8
bright7=000000
