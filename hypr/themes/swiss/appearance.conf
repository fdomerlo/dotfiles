# ==============================================================================
# Apariencia, animaciones e input base (Swiss · Editorial minimal)
#
# Estilo tipografico suizo: blanco frio, tinta casi negra, azul Klein como
# unico acento y reglas finas. Sin blur, sin sombras y sin esquinas: los planos
# se separan con hairlines y espacio en blanco, no con profundidad.
# ==============================================================================

general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    # Azul Klein para el foco; hairline frio para lo inactivo.
    col.active_border = rgba(002fa7ff)
    col.inactive_border = rgba(dadad5ff)
    layout = dwindle
    resize_on_border = true
    allow_tearing = true
}

decoration {
    # Rectilineo: sin esquinas redondeadas.
    rounding = 0
    active_opacity = 1.0
    inactive_opacity = 1.0
    dim_inactive = false

    shadow {
        enabled = false
    }

    blur {
        enabled = false
    }
}

animations {
    enabled = true
    # Movimiento editorial: mas lento y con desaceleracion amplia, sin el
    # "snap" de terminal de mr-robot.
    bezier = editorial, 0.16, 1.0, 0.3, 1.0
    animation = windows, 1, 4, editorial, slide
    animation = windowsOut, 1, 4, editorial, slide
    animation = windowsMove, 1, 4, editorial
    animation = fade, 1, 4, editorial
    animation = workspaces, 1, 5, editorial, slide
    animation = specialWorkspace, 1, 5, editorial, slidevert
    animation = layers, 1, 4, editorial, fade
}

# Capas Wayland (sin blur; transiciones limpias y rectas)
layerrule = animation slide top, match:namespace ^(waybar)$
layerrule = dim_around on, match:namespace ^(launcher|quickshell-launcher)$
layerrule = animation popin 96%, match:namespace ^(launcher|quickshell-launcher)$
layerrule = animation fade, match:namespace ^(swaync-control-center)$
layerrule = animation slide right, match:namespace ^(swaync-notification-window)$
layerrule = animation popin 96%, match:namespace ^(swayosd)$
layerrule = animation fade, match:namespace ^(quickshell-overview)$

dwindle {
    preserve_split = true
    smart_resizing = true
}

misc {
    vrr = 1
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    focus_on_activate = true
    animate_manual_resizes = true
    animate_mouse_windowdragging = true
    # XDG_CURRENT_DESKTOP se define como "Hyprland:GNOME" en env.conf (intencional,
    # para los portales de GNOME). Esto silencia el aviso de "gestionado externamente".
    disable_xdg_env_checks = true
}

input {
    kb_layout = latam
    kb_variant =
    kb_model = pc105
    kb_options =
    # NumLock encendido al iniciar la sesión (workspaces con el teclado numérico).
    numlock_by_default = true
    # Foco "loose": el puntero hace hover y scroll en la ventana bajo el cursor,
    # pero el foco de teclado solo cambia al hacer clic. Evita que los modales y
    # menús (DBeaver, fuzzel, diálogos XWayland) se cierren al mover el mouse.
    # float_switch_override_focus=0 impide el refoco forzado al cruzar entre una
    # ventana flotante (modal) y una en mosaico.
    follow_mouse = 2
    float_switch_override_focus = 0
    sensitivity = 0

    touchpad {
        natural_scroll = true
        tap-to-click = true
        tap-and-drag = true
        clickfinger_behavior = true
        disable_while_typing = true
        middle_button_emulation = false
    }
}

gestures {
    workspace_swipe_distance = 300
    workspace_swipe_invert = true
    workspace_swipe_min_speed_to_force = 30
    workspace_swipe_cancel_ratio = 0.5
    workspace_swipe_create_new = true
    workspace_swipe_direction_lock = true
    workspace_swipe_direction_lock_threshold = 10
    workspace_swipe_forever = true
}

# Gestos Touchpad estilo GNOME (Hyprland 0.55+)
# 3 dedos horizontal: cambio fluido 1:1 de escritorios (como en GNOME Shell)
gesture = 3, horizontal, workspace

# 3 dedos hacia arriba: lanzador unificado (Quickshell)
gesture = 3, up, dispatcher, exec, ~/.config/hypr/scripts/launcher-toggle.sh
# 3 dedos hacia abajo: overview tipo Activities (Quickshell)
gesture = 3, down, dispatcher, exec, ~/.config/hypr/scripts/overview-toggle.sh

cursor {
    # Deshabilita cursores por hardware: evita el flickeo del puntero en setups multi-GPU o salidas en NVIDIA/Nouveau
    no_hardware_cursors = true
    # Evita que Hyprland sobreescriba el tema de cursor de GNOME en GSettings/dconf al volver a GNOME.
    sync_gsettings_theme = false
}
