# ==============================================================================
# Hyprlock - Pantalla de bloqueo (Swiss · Editorial minimal)
#
# Fondo atenuado y desenfocado + tarjeta blanca recta con reloj en Inter,
# regla azul Klein y un pequeno cuadrado rojo. Sin telemetria ni HUD: solo
# tipografia, hairlines y espacio en blanco.
# ==============================================================================

$font = Inter
$mono = JetBrains Mono

general {
    hide_cursor = true
    ignore_empty_input = true
    fail_timeout = 2000
}

animations {
    enabled = true
    bezier = editorial, 0.16, 1.0, 0.3, 1.0
    animation = fadeIn, 1, 4, editorial
    animation = fadeOut, 1, 3, editorial
    animation = inputFieldDots, 1, 2, editorial
    animation = inputFieldColors, 1, 3, editorial
}

background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size = 6
    contrast = 1.0
    brightness = 0.40
    vibrancy = 0.0
}

# Tarjeta editorial centrada
shape {
    monitor =
    size = 460, 340
    color = rgba(fafaf7f2)
    rounding = 0
    border_size = 1
    border_color = rgba(dadad5ff)
    shadow_passes = 3
    shadow_size = 18
    shadow_color = rgba(00000059)
    position = 0, 0
    halign = center
    valign = center
    zindex = 1
}

# Regla azul Klein en el borde superior de la tarjeta
shape {
    monitor =
    size = 460, 4
    color = rgba(002fa7ff)
    rounding = 0
    position = 0, 168
    halign = center
    valign = center
    zindex = 2
}

# Cuadrado rojo suizo en la esquina inferior izquierda
shape {
    monitor =
    size = 10, 10
    color = rgba(c81e1eff)
    rounding = 0
    position = -208, -150
    halign = center
    valign = center
    zindex = 2
}

# Reloj
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(0a0a0aff)
    font_size = 76
    font_family = Inter Bold
    position = 0, 76
    halign = center
    valign = center
    zindex = 2
}

# Fecha
label {
    monitor =
    text = cmd[update:60000] date +"%a %d %b %Y" | tr '[:lower:]' '[:upper:]'
    color = rgba(002fa7ff)
    font_size = 11
    font_family = $font
    position = 0, 18
    halign = center
    valign = center
    zindex = 2
}

# Hairline bajo la fecha
shape {
    monitor =
    size = 360, 1
    color = rgba(dadad5ff)
    rounding = 0
    position = 0, -6
    halign = center
    valign = center
    zindex = 2
}

# Campo de contraseña
input-field {
    monitor =
    size = 340, 46
    outline_thickness = 1
    rounding = 0
    dots_size = 0.20
    dots_spacing = 0.24
    dots_center = true
    outer_color = rgba(002fa7ff)
    inner_color = rgba(ffffffff)
    font_color = rgba(0a0a0aff)
    check_color = rgba(1f6f43ff)
    fail_color = rgba(c81e1eff)
    capslock_color = rgba(9a6700ff)
    fade_on_empty = false
    font_family = $font
    placeholder_text = Contraseña
    check_text = Verificando...
    fail_text = Acceso denegado · $ATTEMPTS
    hide_input = false
    position = 0, -72
    halign = center
    valign = center
    zindex = 2
}

# Usuario y equipo
label {
    monitor =
    text = cmd[update:60000] printf '%s@%s' "$USER" "$(hostname -s)"
    color = rgba(5f6368ff)
    font_size = 11
    font_family = $mono
    position = 0, -120
    halign = center
    valign = center
    zindex = 2
}

# Identificador de perfil
label {
    monitor =
    text = [ SWISS · HYPRLOCK ]
    color = rgba(5f636899)
    font_size = 9
    font_family = $font
    position = 0, -152
    halign = center
    valign = center
    zindex = 2
}
