# ==============================================================================
# Fuzzel - Swiss
# Lanzador nativo Wayland: blanco frio, borde hairline, tipografia Inter y
# seleccion en azul Klein con texto blanco. Sin esquinas redondeadas.
# ==============================================================================

[main]
font=Inter:size=11
prompt="› "
placeholder=Buscar...
terminal=foot -e
icons-enabled=no
show-actions=no
fields=filename,name,generic,keywords,categories
width=54
lines=12
line-height=22
horizontal-pad=28
vertical-pad=22
inner-pad=14
image-size-ratio=0.6
layer=overlay
keyboard-focus=on-demand
exit-on-keyboard-focus-loss=yes

[colors]
background=fafaf7ff
text=0a0a0aff
prompt=002fa7ff
placeholder=6b7280ff
input=0a0a0aff
match=c81e1eff
selection=002fa7ff
selection-text=ffffffff
selection-match=ffffffff
counter=6b7280ff
border=dadad5ff

[border]
width=1
radius=2
