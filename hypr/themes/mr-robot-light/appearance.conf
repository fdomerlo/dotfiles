# ==============================================================================
# Apariencia, animaciones e input base (Mr. Robot Light · Modo Diurno Táctico)
# Misma geometría cortante, cero vidrio, Smart Gaps y ritmo terminal que
# mr-robot, traducidos a una paleta fría de papel técnico / hormigón mate.
# ==============================================================================

general {
    gaps_in = 2
    gaps_out = 4
    border_size = 2
    # Acero profundo de alto contraste en foco; pizarra suave en inactivo.
    # El carmesí se reserva exclusivamente para alertas en la UI.
    col.active_border = rgba(1d617dff)
    col.inactive_border = rgba(b8c6d0ff)
    layout = dwindle
    resize_on_border = true
    allow_tearing = true
}

decoration {
    rounding = 2
    # Separación sutil de foco calibrada para luz diurna sin blur.
    active_opacity = 0.97
    inactive_opacity = 0.92
    dim_inactive = false

    shadow {
        enabled = false
    }

    blur {
        enabled = false
    }
}

animations {
    enabled = true
    # Movimiento corto y seco, estilo terminal (idéntico a mr-robot).
    bezier = terminal, 0.2, 1.0, 0.3, 1.0
    animation = windows, 1, 3, terminal, slide
    animation = windowsOut, 1, 3, terminal, slide
    animation = windowsMove, 1, 3, terminal
    animation = fade, 1, 3, terminal
    animation = workspaces, 1, 4, terminal, slide
    animation = specialWorkspace, 1, 4, terminal, slidevert
    animation = layers, 1, 3, terminal, fade
}

# Smart Gaps ("no gaps when only"): parte del ADN de la familia mr-robot para
# encajar con su Waybar de borde a borde. Elimina márgenes, bordes y esquinas
# redondeadas con una sola ventana visible en tiling (w[tv1]) o maximizada (f[1]).
workspace = w[tv1], gapsout:0, gapsin:0
workspace = f[1], gapsout:0, gapsin:0
windowrule = match:float false, match:workspace w[tv1], border_size 0
windowrule = match:float false, match:workspace w[tv1], rounding 0
windowrule = match:float false, match:workspace f[1], border_size 0
windowrule = match:float false, match:workspace f[1], rounding 0

# Capas Wayland (Hyprland 0.55+: transiciones limpias acordes al estilo terminal sin blur)
layerrule = animation slide top, match:namespace ^(waybar|quickshell-bar)$
layerrule = dim_around on, match:namespace ^(launcher|quickshell-launcher)$
layerrule = animation popin 94%, match:namespace ^(launcher|quickshell-launcher)$
layerrule = animation fade, match:namespace ^(swaync-control-center|quickshell-notif-center|quickshell-calendar)$
layerrule = animation slide right, match:namespace ^(swaync-notification-window|quickshell-notifications)$
layerrule = animation popin 94%, match:namespace ^(swayosd|quickshell-osd)$
layerrule = animation fade, match:namespace ^(quickshell-overview)$

dwindle {
    preserve_split = true
    smart_resizing = true
}

misc {
    vrr = 1
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    focus_on_activate = true
    animate_manual_resizes = true
    animate_mouse_windowdragging = true
    # XDG_CURRENT_DESKTOP se define como "Hyprland:GNOME" en env.conf (intencional,
    # para los portales de GNOME). Esto silencia el aviso de "gestionado externamente".
    disable_xdg_env_checks = true
}

input {
    kb_layout = latam
    kb_variant =
    kb_model = pc105
    kb_options =
    # NumLock encendido al iniciar la sesión (workspaces con el teclado numérico).
    numlock_by_default = true
    # Foco "loose": el puntero hace hover y scroll en la ventana bajo el cursor,
    # pero el foco de teclado solo cambia al hacer clic. Evita que los modales y
    # menús (DBeaver, fuzzel, diálogos XWayland) se cierren al mover el mouse.
    # float_switch_override_focus=0 impide el refoco forzado al cruzar entre una
    # ventana flotante (modal) y una en mosaico.
    follow_mouse = 2
    float_switch_override_focus = 0
    sensitivity = 0

    touchpad {
        natural_scroll = true
        tap-to-click = true
        tap-and-drag = true
        clickfinger_behavior = true
        disable_while_typing = true
        middle_button_emulation = false
    }
}

gestures {
    workspace_swipe_distance = 300
    workspace_swipe_invert = true
    workspace_swipe_min_speed_to_force = 30
    workspace_swipe_cancel_ratio = 0.5
    workspace_swipe_create_new = true
    workspace_swipe_direction_lock = true
    workspace_swipe_direction_lock_threshold = 10
    workspace_swipe_forever = true
}

# Gestos Touchpad estilo GNOME (Hyprland 0.55+)
# 3 dedos horizontal: cambio fluido 1:1 de escritorios (como en GNOME Shell)
gesture = 3, horizontal, workspace

# 3 dedos hacia arriba: lanzador unificado (Quickshell)
gesture = 3, up, dispatcher, exec, ~/.config/hypr/scripts/launcher-toggle.sh
# 3 dedos hacia abajo: overview tipo Activities (Quickshell)
gesture = 3, down, dispatcher, exec, ~/.config/hypr/scripts/overview-toggle.sh

cursor {
    # Deshabilita cursores por hardware: evita el flickeo del puntero en setups multi-GPU o salidas en NVIDIA/Nouveau
    no_hardware_cursors = true
    # Evita que Hyprland sobreescriba el tema de cursor de GNOME en GSettings/dconf al volver a GNOME.
    sync_gsettings_theme = false
}
