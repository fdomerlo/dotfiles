# ==============================================================================
# Foot Terminal - Mr. Robot Light (Modo Diurno Táctico)
# ==============================================================================

[main]
font=JetBrains Mono:size=10
pad=12x12 center
initial-window-size-pixels=920x560
resize-delay-ms=50
initial-color-theme=light

[scrollback]
lines=10000

[cursor]
style=beam
blink=yes

[colors-light]
alpha=0.96
background=edf1f4
foreground=0d171d
cursor=edf1f4 b52323
selection-foreground=0d171d
selection-background=d2e3ec
urls=1d617d

# Paleta ANSI diurna: tinta acero, verde técnico y carmesí de alerta
regular0=0d171d
regular1=b52323
regular2=1e6b4f
regular3=946800
regular4=1d617d
regular5=6c4f94
regular6=1e6b78
regular7=4c6370

bright0=5f7684
bright1=cc3333
bright2=16805a
bright3=ad7900
bright4=277899
bright5=8060ad
bright6=26808f
bright7=05080b
