# ==============================================================================
# Fuzzel - Mr. Robot Light (Modo Diurno Táctico)
# Lanzador nativo Wayland: papel técnico frío mate, borde acero de 1px,
# esquinas rectas y selección tintada en pizarra-acero con match carmesí.
# ==============================================================================

[main]
font=JetBrains Mono:size=10.5
prompt="> "
placeholder=Buscar...
terminal=foot -e
icons-enabled=no
show-actions=no
fields=filename,name,generic,keywords,categories
width=54
lines=12
line-height=22
horizontal-pad=28
vertical-pad=22
inner-pad=14
image-size-ratio=0.6
layer=overlay
keyboard-focus=on-demand
exit-on-keyboard-focus-loss=yes

[colors]
background=edf1f4f7
text=0d171dff
prompt=1d617dff
placeholder=6c8290ff
input=0d171dff
match=b52323ff
selection=d2e3ecff
selection-text=0d171dff
selection-match=b52323ff
counter=6c8290ff
border=1d617dff

[border]
width=1
radius=0
