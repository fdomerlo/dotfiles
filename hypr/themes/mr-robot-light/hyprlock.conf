# ==============================================================================
# Hyprlock - Pantalla de bloqueo (Mr. Robot Light · HUD Táctico Diurno)
# ==============================================================================

$font = JetBrains Mono
$icon_font = Symbols Nerd Font Mono

general {
    hide_cursor = true
    ignore_empty_input = true
    fail_timeout = 2000
}

animations {
    enabled = true
    bezier = easeOut, 0.22, 1, 0.36, 1
    animation = fadeIn, 1, 4, easeOut
    animation = fadeOut, 1, 3, easeOut
    animation = inputFieldDots, 1, 2, easeOut
    animation = inputFieldColors, 1, 3, easeOut
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 5
    contrast = 0.94
    brightness = 0.88
    vibrancy = 0.06
}

# Panel táctico central de bordes rectos para garantizar contraste sobre cualquier ventana
shape {
    monitor =
    size = 448, 464
    color = rgba(edf1f4eb)
    rounding = 0
    border_size = 1
    border_color = rgba(1d617d99)
    position = 0, 26
    halign = center
    valign = center
    zindex = 0
}

# Círculo exterior del candado
shape {
    monitor =
    size = 132, 132
    color = rgba(f5f8fafa)
    rounding = -1
    border_size = 2
    border_color = rgba(b52323ff) rgba(1d617dff) 45deg
    position = 0, 42
    halign = center
    valign = center
    zindex = 1
}

# Retícula circular interior
shape {
    monitor =
    size = 110, 110
    color = rgba(00000000)
    rounding = -1
    border_size = 1
    border_color = rgba(b8c6d0e6)
    position = 0, 42
    halign = center
    valign = center
    zindex = 1
}

# Ícono grande de candado centrado en el círculo
label {
    monitor =
    text = 󰌾
    color = rgba(b52323ff)
    font_size = 44
    font_family = $icon_font
    position = 0, 43
    halign = center
    valign = center
    zindex = 2
}

# Reloj (usa `date` para respetar /etc/localtime)
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(0d171dff)
    font_size = 60
    font_family = JetBrains Mono Bold
    position = 0, 198
    halign = center
    valign = center
    zindex = 2
}

# Fecha
label {
    monitor =
    text = cmd[update:60000] date +"%a %d %b %Y" | tr '[:lower:]' '[:upper:]'
    color = rgba(1d617dff)
    font_size = 12
    font_family = $font
    position = 0, 144
    halign = center
    valign = center
    zindex = 2
}

# Etiqueta de estado debajo del candado
label {
    monitor =
    text = [ SESSION LOCKED // PAM ARMED ]
    color = rgba(4c6370ff)
    font_size = 11
    font_family = $font
    position = 0, -50
    halign = center
    valign = center
    zindex = 2
}

# Campo de contraseña
input-field {
    monitor =
    size = 340, 48
    outline_thickness = 1
    rounding = 0
    dots_size = 0.22
    dots_spacing = 0.24
    dots_center = true
    outer_color = rgba(1d617dff)
    inner_color = rgba(f7f9fbf5)
    font_color = rgba(0d171dff)
    check_color = rgba(1e6b4fff)
    fail_color = rgba(b52323ff)
    capslock_color = rgba(946800ff)
    fade_on_empty = false
    font_family = $font
    placeholder_text = [ Autenticación requerida ]
    check_text = [ Verificando... ]
    fail_text = [ Acceso denegado · $ATTEMPTS ]
    hide_input = false
    position = 0, -104
    halign = center
    valign = center
    zindex = 2
}

# Usuario y equipo
label {
    monitor =
    text = cmd[update:60000] printf '%s@%s' "$USER" "$(hostname -s)"
    color = rgba(1d617dff)
    font_size = 13
    font_family = $font
    position = 0, -158
    halign = center
    valign = center
    zindex = 2
}

# Telemetría HUD superior izquierda
label {
    monitor =
    text = cmd[update:4000] ~/.config/hypr/scripts/lock-telemetry.sh left
    color = rgba(2c4350d9)
    font_size = 11
    font_family = $font
    text_align = left
    position = 28, -24
    halign = left
    valign = top
    zindex = 1
}

# Telemetría HUD superior derecha
label {
    monitor =
    text = cmd[update:4000] ~/.config/hypr/scripts/lock-telemetry.sh right
    color = rgba(2c4350d9)
    font_size = 11
    font_family = $font
    text_align = right
    position = -28, -24
    halign = right
    valign = top
    zindex = 1
}

# Stream sutil de monitoreo en vivo en el fondo
label {
    monitor =
    text = cmd[update:2500] ~/.config/hypr/scripts/lock-telemetry.sh stream
    color = rgba(1d617d66)
    font_size = 10
    font_family = $font
    text_align = left
    position = 28, 22
    halign = left
    valign = bottom
    zindex = -1
}

# Identificador de perfil
label {
    monitor =
    text = [ THEME // MR-ROBOT-LIGHT · HYPRLOCK ]
    color = rgba(4c6370b3)
    font_size = 10
    font_family = $font
    text_align = right
    position = -28, 22
    halign = right
    valign = bottom
    zindex = -1
}
