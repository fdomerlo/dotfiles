# ==============================================================================
# Fuzzel - Gruvbox Light (Harvest)
# Lanzador nativo Wayland: crema calido, borde tan, tipografia Inter y
# seleccion slate con texto crema.
# ==============================================================================

[main]
font=Inter:size=11
prompt="› "
placeholder=Buscar...
terminal=foot -e
icons-enabled=no
show-actions=no
fields=filename,name,generic,keywords,categories
width=54
lines=12
line-height=22
horizontal-pad=28
vertical-pad=22
inner-pad=14
image-size-ratio=0.6
layer=overlay
keyboard-focus=on-demand
exit-on-keyboard-focus-loss=yes

[colors]
background=fbf1c7e6
text=3c3836ff
prompt=4f5d6bff
placeholder=928374ff
input=3c3836ff
match=cc241dff
selection=4f5d6bff
selection-text=fbf1c7ff
selection-match=fbf1c7ff
counter=928374ff
border=d5c4a1ff

[border]
width=1
radius=12
