# ==============================================================================
# Fuzzel - gruvbox-light · Whitesmoke
# Lanzador nativo Wayland: whitesmoke translucido, borde neutro, tipografia Inter y
# seleccion slate con texto whitesmoke.
# ==============================================================================

[main]
font=Inter:size=11
prompt="› "
placeholder=Buscar...
terminal=foot -e
icons-enabled=no
show-actions=no
fields=filename,name,generic,keywords,categories
width=54
lines=12
line-height=22
horizontal-pad=28
vertical-pad=22
inner-pad=14
image-size-ratio=0.6
layer=overlay
keyboard-focus=on-demand
exit-on-keyboard-focus-loss=yes

[colors]
background=f5f5f5d6
text=2f2f2fff
prompt=4f5d6bff
placeholder=8a8a8aff
input=2f2f2fff
match=cc241dff
selection=4f5d6bff
selection-text=f5f5f5ff
selection-match=ffffffff
counter=8a8a8aff
border=d9d9d9ff

[border]
width=1
radius=12
