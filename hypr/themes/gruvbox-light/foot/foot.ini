# ==============================================================================
# Foot Terminal - gruvbox-light · Whitesmoke
# Base whitesmoke con la paleta Gruvbox para los colores ANSI.
# ==============================================================================

[main]
font=JetBrains Mono:size=10
pad=12x12 center
initial-window-size-pixels=920x560
resize-delay-ms=50
initial-color-theme=light

[scrollback]
lines=10000

[cursor]
style=beam
blink=yes

[colors-light]
alpha=0.94
background=f5f5f5
foreground=2f2f2f
cursor=f5f5f5 4f5d6b
selection-foreground=2f2f2f
selection-background=d9d9d9
urls=4f5d6b

regular0=2f2f2f
regular1=cc241d
regular2=98971a
regular3=d79921
regular4=458588
regular5=b16286
regular6=689d6a
regular7=6b6b6b

bright0=8a8a8a
bright1=9d0006
bright2=79740e
bright3=b57614
bright4=076678
bright5=8f3f71
bright6=427b58
bright7=111111
