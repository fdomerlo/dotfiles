# ==============================================================================
# Apariencia, animaciones e input base (Gruvbox Light · Harvest)
#
# Referencia: Gruvbox Light calido (crema, tan, tinta marron y naranja tostado)
# con una unica barra inferior redondeada y translucida. Ventanas y paneles
# redondeados, blur suave y sombras calidas para separar planos.
# ==============================================================================

general {
    gaps_in = 6
    gaps_out = 10
    border_size = 2
    # Naranja tostado para el foco; tan apagado para lo inactivo.
    col.active_border = rgba(d65d0eff)
    col.inactive_border = rgba(d5c4a1ff)
    layout = dwindle
    resize_on_border = true
    allow_tearing = true
}

decoration {
    # Esquinas redondeadas como la referencia.
    rounding = 10
    active_opacity = 0.96
    inactive_opacity = 0.92
    dim_inactive = false

    shadow {
        enabled = true
        range = 16
        render_power = 3
        offset = 0 4
        color = rgba(60, 56, 54, 0.22)
        color_inactive = rgba(60, 56, 54, 0.12)
    }

    blur {
        enabled = true
        size = 5
        passes = 3
        noise = 0.01
        contrast = 1.0
        brightness = 1.0
        vibrancy = 0.15
    }
}

animations {
    enabled = true
    # Movimiento calido y directo, sin el "snap" de terminal de mr-robot.
    bezier = harvest, 0.22, 1.0, 0.36, 1.0
    animation = windows, 1, 3, harvest, slide
    animation = windowsOut, 1, 3, harvest, slide
    animation = windowsMove, 1, 3, harvest
    animation = fade, 1, 3, harvest
    animation = workspaces, 1, 4, harvest, slide
    animation = specialWorkspace, 1, 4, harvest, slidevert
    animation = layers, 1, 3, harvest, fade
}

# Capas Wayland: blur suave solo en paneles flotantes (barra, launcher,
# notificaciones y OSD) para el efecto vidrio calido de la referencia.
layerrule = blur on, match:namespace ^(waybar)$
layerrule = ignore_alpha 0.2, match:namespace ^(waybar)$
layerrule = blur_popups on, match:namespace ^(waybar)$
layerrule = animation slide bottom, match:namespace ^(waybar)$

layerrule = blur on, match:namespace ^(launcher|quickshell-launcher)$
layerrule = ignore_alpha 0.2, match:namespace ^(launcher|quickshell-launcher)$
layerrule = dim_around on, match:namespace ^(launcher|quickshell-launcher)$
layerrule = animation popin 96%, match:namespace ^(launcher|quickshell-launcher)$

layerrule = blur on, match:namespace ^(swaync-control-center)$
layerrule = ignore_alpha 0.2, match:namespace ^(swaync-control-center)$
layerrule = animation fade, match:namespace ^(swaync-control-center)$

layerrule = blur on, match:namespace ^(swaync-notification-window)$
layerrule = ignore_alpha 0.2, match:namespace ^(swaync-notification-window)$
layerrule = animation slide right, match:namespace ^(swaync-notification-window)$

layerrule = blur on, match:namespace ^(swayosd)$
layerrule = ignore_alpha 0.2, match:namespace ^(swayosd)$
layerrule = animation popin 96%, match:namespace ^(swayosd)$

layerrule = blur on, match:namespace ^(fuzzel)$
layerrule = ignore_alpha 0.2, match:namespace ^(fuzzel)$

layerrule = blur on, match:namespace ^(quickshell-overview)$
layerrule = ignore_alpha 0.2, match:namespace ^(quickshell-overview)$
layerrule = animation fade, match:namespace ^(quickshell-overview)$

dwindle {
    preserve_split = true
    smart_resizing = true
}

misc {
    vrr = 1
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    focus_on_activate = true
    animate_manual_resizes = true
    animate_mouse_windowdragging = true
    # XDG_CURRENT_DESKTOP se define como "Hyprland:GNOME" en env.conf (intencional,
    # para los portales de GNOME). Esto silencia el aviso de "gestionado externamente".
    disable_xdg_env_checks = true
}

input {
    kb_layout = latam
    kb_variant =
    kb_model = pc105
    kb_options =
    # NumLock encendido al iniciar la sesión (workspaces con el teclado numérico).
    numlock_by_default = true
    # Foco "loose": el puntero hace hover y scroll en la ventana bajo el cursor,
    # pero el foco de teclado solo cambia al hacer clic. Evita que los modales y
    # menús (DBeaver, fuzzel, diálogos XWayland) se cierren al mover el mouse.
    # float_switch_override_focus=0 impide el refoco forzado al cruzar entre una
    # ventana flotante (modal) y una en mosaico.
    follow_mouse = 2
    float_switch_override_focus = 0
    sensitivity = 0

    touchpad {
        natural_scroll = true
        tap-to-click = true
        tap-and-drag = true
        clickfinger_behavior = true
        disable_while_typing = true
        middle_button_emulation = false
    }
}

gestures {
    workspace_swipe_distance = 300
    workspace_swipe_invert = true
    workspace_swipe_min_speed_to_force = 30
    workspace_swipe_cancel_ratio = 0.5
    workspace_swipe_create_new = true
    workspace_swipe_direction_lock = true
    workspace_swipe_direction_lock_threshold = 10
    workspace_swipe_forever = true
}

# Gestos Touchpad estilo GNOME (Hyprland 0.55+)
# 3 dedos horizontal: cambio fluido 1:1 de escritorios (como en GNOME Shell)
gesture = 3, horizontal, workspace

# 3 dedos hacia arriba: lanzador unificado (Quickshell)
gesture = 3, up, dispatcher, exec, ~/.config/hypr/scripts/launcher-toggle.sh
# 3 dedos hacia abajo: overview tipo Activities (Quickshell)
gesture = 3, down, dispatcher, exec, ~/.config/hypr/scripts/overview-toggle.sh

cursor {
    # Deshabilita cursores por hardware: evita el flickeo del puntero en setups multi-GPU o salidas en NVIDIA/Nouveau
    no_hardware_cursors = true
    # Evita que Hyprland sobreescriba el tema de cursor de GNOME en GSettings/dconf al volver a GNOME.
    sync_gsettings_theme = false
}
