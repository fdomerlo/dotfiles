# ==============================================================================
# Hyprlock - Pantalla de bloqueo (gruvbox-light · Whitesmoke)
#
# Fondo atenuado y desenfocado + tarjeta whitesmoke recta con reloj en Inter,
# regla slate y un pequeno cuadrado verde/rojo. Sin telemetria ni
# HUD: tipografia, hairlines y espacio en blanco.
# ==============================================================================

$font = Inter
$mono = JetBrains Mono

general {
    hide_cursor = true
    ignore_empty_input = true
    fail_timeout = 2000
}

animations {
    enabled = true
    bezier = harvest, 0.22, 1.0, 0.36, 1.0
    animation = fadeIn, 1, 3, harvest
    animation = fadeOut, 1, 3, harvest
    animation = inputFieldDots, 1, 2, harvest
    animation = inputFieldColors, 1, 3, harvest
}

background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size = 6
    contrast = 1.0
    brightness = 0.40
    vibrancy = 0.0
}

# Tarjeta crema centrada
shape {
    monitor =
    size = 460, 340
    color = rgba(f5f5f5d9)
    rounding = 12
    border_size = 1
    border_color = rgba(0000001a)
    shadow_passes = 3
    shadow_size = 18
    shadow_color = rgba(0f0f0f59)
    position = 0, 0
    halign = center
    valign = center
    zindex = 1
}

# Regla slate en el borde superior de la tarjeta
shape {
    monitor =
    size = 420, 4
    color = rgba(4f5d6bff)
    rounding = 0
    position = 0, 168
    halign = center
    valign = center
    zindex = 2
}

# Cuadrado verde en la esquina inferior izquierda
shape {
    monitor =
    size = 10, 10
    color = rgba(152, 151, 26, 1)
    rounding = 0
    position = -208, -150
    halign = center
    valign = center
    zindex = 2
}

# Reloj
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(1f1f1fff)
    font_size = 76
    font_family = Inter Bold
    position = 0, 76
    halign = center
    valign = center
    zindex = 2
}

# Fecha
label {
    monitor =
    text = cmd[update:60000] date +"%a %d %b %Y" | tr '[:lower:]' '[:upper:]'
    color = rgba(4f5d6bff)
    font_size = 11
    font_family = $font
    position = 0, 18
    halign = center
    valign = center
    zindex = 2
}

# Hairline bajo la fecha
shape {
    monitor =
    size = 360, 1
    color = rgba(0000001a)
    rounding = 0
    position = 0, -6
    halign = center
    valign = center
    zindex = 2
}

# Campo de contraseña
input-field {
    monitor =
    size = 340, 46
    outline_thickness = 1
    rounding = 10
    dots_size = 0.20
    dots_spacing = 0.24
    dots_center = true
    outer_color = rgba(4f5d6bff)
    inner_color = rgba(fafafae6)
    font_color = rgba(1f1f1fff)
    check_color = rgba(152, 151, 26, 1)
    fail_color = rgba(204, 36, 29, 1)
    capslock_color = rgba(215, 153, 33, 1)
    fade_on_empty = false
    font_family = $font
    placeholder_text = Contraseña
    check_text = Verificando...
    fail_text = Acceso denegado · $ATTEMPTS
    hide_input = false
    position = 0, -72
    halign = center
    valign = center
    zindex = 2
}

# Usuario y equipo
label {
    monitor =
    text = cmd[update:60000] printf '%s@%s' "$USER" "$(hostname -s)"
    color = rgba(122, 122, 122, 1)
    font_size = 11
    font_family = $mono
    position = 0, -120
    halign = center
    valign = center
    zindex = 2
}

# Identificador de perfil
label {
    monitor =
    text = [ GRUVBOX-LIGHT · HYPRLOCK ]
    color = rgba(122, 122, 122, 0.70)
    font_size = 9
    font_family = $font
    position = 0, -152
    halign = center
    valign = center
    zindex = 2
}
