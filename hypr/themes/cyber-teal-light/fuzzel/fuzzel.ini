text=162328ff
prompt=007a91ff
placeholder=5c737aff
input=162328ff
match=005f73ff
selection=007a91ff
selection-text=f7fbfcff
selection-match=ffffffff
counter=5c737aff
border=007a9188

[border]
width=2
radius=14
selection-radius=7
