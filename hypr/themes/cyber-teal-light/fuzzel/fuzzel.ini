[main]
font=Inter:size=10.5
prompt="› "
placeholder=Buscar...
terminal=foot -e
icons-enabled=no
show-actions=no
fields=filename,name,generic,keywords,categories
width=54
lines=12
line-height=21
horizontal-pad=28
vertical-pad=24
inner-pad=14
image-size-ratio=0.6
layer=overlay
keyboard-focus=on-demand
exit-on-keyboard-focus-loss=yes

[colors]
