# ==============================================================================
# Hyprlock — Pantalla de bloqueo (Cyber-Teal Material 3 · Modo Claro)
# ==============================================================================

$font = JetBrains Mono
$icon_font = Symbols Nerd Font Mono

general {
    hide_cursor = true
    ignore_empty_input = true
    fail_timeout = 2000
}

animations {
    enabled = true
    bezier = m3_decel, 0.05, 0.7, 0.1, 1.0
    animation = fadeIn, 1, 4, m3_decel
    animation = fadeOut, 1, 3, m3_decel
    animation = inputFieldDots, 1, 2, m3_decel
    animation = inputFieldColors, 1, 3, m3_decel
}

background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size = 7
    contrast = 0.96
    brightness = 0.88
    vibrancy = 0.10
}

# Tarjeta glass central clara para garantizar contraste sobre cualquier fondo
shape {
    monitor =
    size = 440, 440
    color = rgba(f2f7f8e6)
    rounding = 20
    border_size = 1
    border_color = rgba(c5d5daff)
    shadow_passes = 3
    shadow_size = 18
    shadow_color = rgba(12202633)
    position = 0, 20
    halign = center
    valign = center
    zindex = 0
}

# Círculo exterior del candado
shape {
    monitor =
    size = 124, 124
    color = rgba(ffffffff)
    rounding = -1
    border_size = 2
    border_color = rgba(006d80ff)
    shadow_passes = 2
    shadow_size = 10
    shadow_color = rgba(12202626)
    position = 0, 38
    halign = center
    valign = center
    zindex = 1
}

# Retícula circular interior
shape {
    monitor =
    size = 104, 104
    color = rgba(00000000)
    rounding = -1
    border_size = 1
    border_color = rgba(c5d5dacc)
    position = 0, 38
    halign = center
    valign = center
    zindex = 1
}

# Ícono grande de candado centrado en el círculo
label {
    monitor =
    text = 󰌾
    color = rgba(006d80ff)
    font_size = 42
    font_family = $icon_font
    position = 0, 39
    halign = center
    valign = center
    zindex = 2
}

# Reloj
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(122026ff)
    font_size = 58
    font_family = JetBrains Mono Bold
    position = 0, 178
    halign = center
    valign = center
    zindex = 2
}

# Fecha
label {
    monitor =
    text = cmd[update:60000] date +"%a %d %b %Y" | tr '[:lower:]' '[:upper:]'
    color = rgba(006d80ff)
    font_size = 12
    font_family = $font
    position = 0, 126
    halign = center
    valign = center
    zindex = 2
}

# Etiqueta de estado debajo del candado
label {
    monitor =
    text = SESIÓN BLOQUEADA // PAM ACTIVO
    color = rgba(5b727aff)
    font_size = 11
    font_family = $font
    position = 0, -48
    halign = center
    valign = center
    zindex = 2
}

# Campo de contraseña
input-field {
    monitor =
    size = 340, 48
    outline_thickness = 2
    rounding = 16
    dots_size = 0.22
    dots_spacing = 0.24
    dots_center = true
    outer_color = rgba(006d80ff)
    inner_color = rgba(fffffff5)
    font_color = rgba(122026ff)
    check_color = rgba(0f766eff)
    fail_color = rgba(c83755ff)
    capslock_color = rgba(b56b00ff)
    fade_on_empty = false
    font_family = $font
    placeholder_text = Autenticación requerida
    check_text = Verificando credenciales...
    fail_text = Acceso denegado ($ATTEMPTS)
    hide_input = false
    position = 0, -100
    halign = center
    valign = center
    zindex = 2
}

# Usuario y equipo
label {
    monitor =
    text = cmd[update:60000] printf '%s@%s' "$USER" "$(hostname -s)"
    color = rgba(0f766eff)
    font_size = 13
    font_family = $font
    position = 0, -154
    halign = center
    valign = center
    zindex = 2
}

# Telemetría HUD superior izquierda
label {
    monitor =
    text = cmd[update:4000] ~/.config/hypr/scripts/lock-telemetry.sh left
    color = rgba(2c4149d9)
    font_size = 11
    font_family = $font
    text_align = left
    position = 28, -24
    halign = left
    valign = top
    zindex = 1
}

# Telemetría HUD superior derecha
label {
    monitor =
    text = cmd[update:4000] ~/.config/hypr/scripts/lock-telemetry.sh right
    color = rgba(2c4149d9)
    font_size = 11
    font_family = $font
    text_align = right
    position = -28, -24
    halign = right
    valign = top
    zindex = 1
}

# Stream sutil de monitoreo en vivo en el fondo
label {
    monitor =
    text = cmd[update:2500] ~/.config/hypr/scripts/lock-telemetry.sh stream
    color = rgba(006d8066)
    font_size = 10
    font_family = $font
    text_align = left
    position = 28, 22
    halign = left
    valign = bottom
    zindex = -1
}

# Identificador de perfil
label {
    monitor =
    text = CYBER-TEAL M3 // LIGHT · HYPRLOCK
    color = rgba(5b727aa6)
    font_size = 10
    font_family = $font
    text_align = right
    position = -28, 22
    halign = right
    valign = bottom
    zindex = -1
}
