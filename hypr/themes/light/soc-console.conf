# ==============================================================================
# Hyprlock · Preset: SOC Console (Cyber-Teal Material 3 · Modo Claro Piedra)
# ==============================================================================

$font = JetBrains Mono
$icon_font = Symbols Nerd Font Mono

general {
    hide_cursor = true
    ignore_empty_input = true
    fail_timeout = 2000
}

animations {
    enabled = true
    bezier = m3_decel, 0.05, 0.7, 0.1, 1.0
    animation = fadeIn, 1, 4, m3_decel
    animation = fadeOut, 1, 3, m3_decel
    animation = inputFieldDots, 1, 2, m3_decel
    animation = inputFieldColors, 1, 3, m3_decel
}

background {
    monitor =
    path =
    color = rgba(e9edf1ff)
}

# Círculo exterior del candado
shape {
    monitor =
    size = 136, 136
    color = rgba(ffffffff)
    rounding = -1
    border_size = 1
    border_color = rgba(006c7f88) rgba(0f7b5b55) 45deg
    position = 0, 52
    halign = center
    valign = center
    zindex = 1
}

# Retícula circular interior
shape {
    monitor =
    size = 114, 114
    color = rgba(00000000)
    rounding = -1
    border_size = 1
    border_color = rgba(8c9aa766)
    position = 0, 52
    halign = center
    valign = center
    zindex = 1
}

# Ícono grande de candado
label {
    monitor =
    text = 󰌾
    color = rgba(006c7fff)
    font_size = 44
    font_family = $icon_font
    position = 0, 53
    halign = center
    valign = center
    zindex = 2
}

# Reloj
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(171f26ff)
    font_size = 60
    font_family = JetBrains Mono Bold
    position = 0, 220
    halign = center
    valign = center
    zindex = 2
}

# Fecha
label {
    monitor =
    text = cmd[update:60000] date +"%a %d %b %Y" | tr '[:lower:]' '[:upper:]'
    color = rgba(006c7fe6)
    font_size = 12
    font_family = $font
    position = 0, 164
    halign = center
    valign = center
    zindex = 2
}

# Estado debajo del candado
label {
    monitor =
    text = [ SOC // SESSION LOCKED · PAM_UNIX ARMED ]
    color = rgba(0f7b5be0)
    font_size = 11
    font_family = $font
    position = 0, -40
    halign = center
    valign = center
    zindex = 2
}

# Campo de contraseña
input-field {
    monitor =
    size = 350, 48
    outline_thickness = 1
    rounding = 12
    dots_size = 0.22
    dots_spacing = 0.24
    dots_center = true
    outer_color = rgba(006c7f88)
    inner_color = rgba(ffffffff)
    font_color = rgba(171f26ff)
    check_color = rgba(0f7b5bff)
    fail_color = rgba(c4324fff)
    capslock_color = rgba(5b4db2ff)
    fade_on_empty = false
    font_family = $font
    placeholder_text = [ Ingresar credenciales ]
    check_text = [ PAM verifying... ]
    fail_text = [ AUTH FAILED · $ATTEMPTS ]
    hide_input = false
    position = 0, -94
    halign = center
    valign = center
    zindex = 2
}

# Usuario y equipo
label {
    monitor =
    text = cmd[update:60000] printf '%s@%s' "$USER" "$(hostname -s)"
    color = rgba(5b4db2e0)
    font_size = 13
    font_family = $font
    position = 0, -148
    halign = center
    valign = center
    zindex = 2
}

# Toda la telemetría + feed progresivo en la esquina superior derecha
label {
    monitor =
    text = cmd[update:1500] ~/.config/hypr/scripts/lock-telemetry.sh soc-feed
    color = rgba(171f26cc)
    font_size = 10
    font_family = $font
    text_align = right
    position = -28, -24
    halign = right
    valign = top
    zindex = 1
}

# Identificador de preset
label {
    monitor =
    text = [ PRESET // SOC-CONSOLE · PIEDRA LIGHT ]
    color = rgba(60707eb8)
    font_size = 10
    font_family = $font
    text_align = right
    position = -28, 22
    halign = right
    valign = bottom
    zindex = -1
}
