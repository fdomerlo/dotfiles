# ==============================================================================
# Paleta Hyprland — Modo Claro (Cyber-Teal Material 3 · Piedra)
# ==============================================================================

general {
    col.active_border = rgba(006c7f66) rgba(0f7b5b44) 45deg
    col.inactive_border = rgba(8c9aa738)
}

decoration {
    active_opacity = 1.0
    inactive_opacity = 0.96
    fullscreen_opacity = 1.0

    shadow {
        color = rgba(171f262e)
        color_inactive = rgba(171f2616)
    }

    blur {
        size = 6
        passes = 3
        noise = 0.01
        contrast = 1.03
        brightness = 1.0
        vibrancy = 0.08
        vibrancy_darkness = 0.0
        ignore_opacity = true
        popups = false
    }
}
