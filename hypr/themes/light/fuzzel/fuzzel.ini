# ==============================================================================
# Fuzzel — Cyber-Teal Material 3 (Modo Claro)
# ==============================================================================

[main]
font=Inter:size=11.5
prompt="› "
placeholder=Buscar...
terminal=foot -e
icons-enabled=no
show-actions=no
fields=filename,name,generic,keywords,categories
width=54
lines=12
line-height=24
horizontal-pad=26
vertical-pad=22
inner-pad=14
image-size-ratio=0.6
layer=overlay
keyboard-focus=on-demand
exit-on-keyboard-focus-loss=yes

[colors]
background=f2f7f8eb
text=122026ff
prompt=006d80ff
placeholder=5b727aff
input=122026ff
match=0f766eff
selection=c3edf6ff
selection-text=002c35ff
selection-match=006d80ff
counter=5b727aff
border=006d80ff

[border]
width=2
radius=20
