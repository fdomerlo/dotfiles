# ==============================================================================
# Fuzzel — Cyber-Teal Material 3 (Modo Claro)
# ==============================================================================

[main]
font=Inter:size=11.5
prompt="› "
placeholder=Buscar...
terminal=foot -e
icons-enabled=no
show-actions=no
fields=filename,name,generic,keywords,categories
width=54
lines=12
line-height=24
horizontal-pad=26
vertical-pad=22
inner-pad=14
image-size-ratio=0.6
layer=overlay
keyboard-focus=on-demand
exit-on-keyboard-focus-loss=yes

[colors]
background=e9edf1f2
text=171f26ff
prompt=006c7fff
placeholder=60707eff
input=171f26ff
match=0f7b5bff
selection=c9ecf3ff
selection-text=00333dff
selection-match=006c7fff
counter=60707eff
border=006c7fff

[border]
width=2
radius=20
