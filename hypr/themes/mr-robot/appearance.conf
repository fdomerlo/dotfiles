# ==============================================================================
# Apariencia, animaciones e input base (Mr. Robot / fsociety)
# ==============================================================================

general {
    gaps_in = 2
    gaps_out = 4
    border_size = 1
    # Acero fino; el rojo se reserva para alertas en la UI.
    # El foco se marca solo con el borde: activo brillante, inactivo oscuro.
    col.active_border = rgba(7dc8f0ff)
    col.inactive_border = rgba(1a2a33ff)
    layout = dwindle
    resize_on_border = true
    allow_tearing = true
}

decoration {
    rounding = 2
    # Transparencia pareja para todas las ventanas, tengan o no foco.
    # El foco se identifica solo por el color del borde.
    active_opacity = 0.95
    inactive_opacity = 0.95
    dim_inactive = false

    shadow {
        enabled = false
    }

    blur {
        enabled = false
    }
}

animations {
    enabled = true
    # Movimiento corto y seco, estilo terminal.
    bezier = terminal, 0.2, 1.0, 0.3, 1.0
    animation = windows, 1, 3, terminal, slide
    animation = windowsOut, 1, 3, terminal, slide
    animation = windowsMove, 1, 3, terminal
    animation = fade, 1, 3, terminal
    animation = workspaces, 1, 4, terminal, slide
    animation = layers, 1, 4, terminal, slide
}

dwindle {
    preserve_split = true
    smart_resizing = true
}

misc {
    vrr = 1
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    focus_on_activate = true
    animate_manual_resizes = true
    animate_mouse_windowdragging = true
    # XDG_CURRENT_DESKTOP se define como "Hyprland:GNOME" en env.conf (intencional,
    # para los portales de GNOME). Esto silencia el aviso de "gestionado externamente".
    disable_xdg_env_checks = true
}

input {
    kb_layout = latam
    kb_variant =
    kb_model = pc105
    kb_options =
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
        tap-to-click = true
        tap-and-drag = true
        clickfinger_behavior = true
        disable_while_typing = true
        middle_button_emulation = false
    }
}

gestures {
    workspace_swipe_distance = 300
    workspace_swipe_invert = true
    workspace_swipe_min_speed_to_force = 30
    workspace_swipe_cancel_ratio = 0.5
    workspace_swipe_create_new = true
    workspace_swipe_direction_lock = true
    workspace_swipe_direction_lock_threshold = 10
    workspace_swipe_forever = true
}

# Gestos Touchpad estilo GNOME (Hyprland 0.55+)
# 3 dedos horizontal: cambio fluido 1:1 de escritorios (como en GNOME Shell)
gesture = 3, horizontal, workspace

# 3 dedos hacia arriba: lanzador de aplicaciones (equivalente a actividades GNOME)
gesture = 3, up, dispatcher, exec, ~/.config/hypr/scripts/toggle-wofi.sh '--show drun' env XDG_CURRENT_DESKTOP=Hyprland:GNOME wofi --show drun

cursor {
    # Evita que Hyprland sobreescriba el tema de cursor de GNOME en GSettings/dconf al volver a GNOME.
    sync_gsettings_theme = false
}
