# ==============================================================================
# Hyprlock - Pantalla de bloqueo (Mr. Robot / fsociety)
# ==============================================================================

background {
    monitor =
    path = screenshot
    blur_passes = 2
    blur_size = 4
    contrast = 1.05
    brightness = 0.35
    vibrancy = 0.15
}

input-field {
    monitor =
    size = 330, 50
    outline_thickness = 1
    dots_size = 0.22
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(4f9fbfff)
    inner_color = rgba(05080bf0)
    font_color = rgba(c3d2ddff)
    fade_on_empty = false
    placeholder_text = [ CONTRASEÑA ]
    hide_input = false
    position = 0, -80
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgba(c83434ff)
    font_size = 64
    font_family = JetBrains Mono Bold
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = rgba(4f9fbfff)
    font_size = 18
    font_family = JetBrains Mono
    position = 0, -160
    halign = center
    valign = center
}
