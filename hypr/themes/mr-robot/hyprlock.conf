# ==============================================================================
# Hyprlock - Pantalla de bloqueo (Mr. Robot / fsociety · HUD Táctico)
# ==============================================================================

$font = JetBrains Mono
$icon_font = Symbols Nerd Font Mono

general {
    hide_cursor = true
    ignore_empty_input = true
    fail_timeout = 2000
}

animations {
    enabled = true
    bezier = easeOut, 0.22, 1, 0.36, 1
    animation = fadeIn, 1, 4, easeOut
    animation = fadeOut, 1, 3, easeOut
    animation = inputFieldDots, 1, 2, easeOut
    animation = inputFieldColors, 1, 3, easeOut
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 5
    contrast = 1.05
    brightness = 0.26
    vibrancy = 0.12
}

# Círculo exterior del candado
shape {
    monitor =
    size = 136, 136
    color = rgba(05080be6)
    rounding = -1
    border_size = 2
    border_color = rgba(c83434ff) rgba(4f9fbfff) 45deg
    shadow_passes = 2
    shadow_size = 12
    shadow_color = rgba(04070acc)
    position = 0, 42
    halign = center
    valign = center
    zindex = 1
}

# Retícula circular interior
shape {
    monitor =
    size = 114, 114
    color = rgba(00000000)
    rounding = -1
    border_size = 1
    border_color = rgba(1d3542d9)
    position = 0, 42
    halign = center
    valign = center
    zindex = 1
}

# Ícono grande de candado centrado en el círculo
label {
    monitor =
    text = 󰌾
    color = rgba(c83434ff)
    font_size = 44
    font_family = $icon_font
    position = 0, 43
    halign = center
    valign = center
    zindex = 2
}

# Reloj (usa `date` para respetar /etc/localtime en Debian 13)
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(eaf2f7ff)
    font_size = 64
    font_family = JetBrains Mono Bold
    position = 0, 215
    halign = center
    valign = center
    zindex = 2
}

# Fecha
label {
    monitor =
    text = cmd[update:60000] date +"%a %d %b %Y" | tr '[:lower:]' '[:upper:]'
    color = rgba(4f9fbfff)
    font_size = 12
    font_family = $font
    position = 0, 156
    halign = center
    valign = center
    zindex = 2
}

# Etiqueta de estado debajo del candado
label {
    monitor =
    text = [ SESSION LOCKED // PAM ARMED ]
    color = rgba(5f7684ff)
    font_size = 11
    font_family = $font
    position = 0, -52
    halign = center
    valign = center
    zindex = 2
}

# Campo de contraseña
input-field {
    monitor =
    size = 340, 48
    outline_thickness = 1
    rounding = 0
    dots_size = 0.22
    dots_spacing = 0.24
    dots_center = true
    outer_color = rgba(4f9fbfff)
    inner_color = rgba(05080bf0)
    font_color = rgba(c3d2ddff)
    check_color = rgba(72d7b0ff)
    fail_color = rgba(c83434ff)
    capslock_color = rgba(e0af68ff)
    fade_on_empty = false
    font_family = $font
    placeholder_text = [ Autenticación requerida ]
    check_text = [ Verificando... ]
    fail_text = [ Acceso denegado · $ATTEMPTS ]
    hide_input = false
    position = 0, -106
    halign = center
    valign = center
    zindex = 2
}

# Usuario y equipo
label {
    monitor =
    text = cmd[update:60000] printf '%s@%s' "$USER" "$(hostname -s)"
    color = rgba(4f9fbfff)
    font_size = 13
    font_family = $font
    position = 0, -162
    halign = center
    valign = center
    zindex = 2
}

# Telemetría HUD superior izquierda
label {
    monitor =
    text = cmd[update:4000] ~/.config/hypr/scripts/lock-telemetry.sh left
    color = rgba(5f7684d9)
    font_size = 11
    font_family = $font
    text_align = left
    position = 28, -24
    halign = left
    valign = top
    zindex = 1
}

# Telemetría HUD superior derecha
label {
    monitor =
    text = cmd[update:4000] ~/.config/hypr/scripts/lock-telemetry.sh right
    color = rgba(5f7684d9)
    font_size = 11
    font_family = $font
    text_align = right
    position = -28, -24
    halign = right
    valign = top
    zindex = 1
}

# Stream sutil de monitoreo en vivo en el fondo
label {
    monitor =
    text = cmd[update:2500] ~/.config/hypr/scripts/lock-telemetry.sh stream
    color = rgba(4f9fbf59)
    font_size = 10
    font_family = $font
    text_align = left
    position = 28, 22
    halign = left
    valign = bottom
    zindex = -1
}

# Identificador de perfil
label {
    monitor =
    text = [ THEME // MR-ROBOT · HYPRLOCK ]
    color = rgba(5f768499)
    font_size = 10
    font_family = $font
    text_align = right
    position = -28, 22
    halign = right
    valign = bottom
    zindex = -1
}
