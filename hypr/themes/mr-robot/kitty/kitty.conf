# ==============================================================================
# Kitty Terminal - Mr. Robot / fsociety
# ==============================================================================

# Tipografía
font_family      JetBrains Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
# font_size está en puntos (pt), no en píxeles.
# A 96 DPI: 9.0 pt ≈ 12 px, equivalente al tamaño de VS Code.
font_size        9.0

# Espaciado interno: margen cómodo para que el contenido no pegue a los bordes
window_padding_width 12

# Comportamiento de ventana
remember_window_size  yes
initial_window_width  920
initial_window_height 560
hide_window_decorations yes
confirm_os_window_close 0

# Cursor fsociety
cursor                #c83434
cursor_text_color     #05080b
cursor_shape          beam
cursor_blink_interval 0.5

# Esquema de color (Mr. Robot / terminal oscuro)
background            #05080b
foreground            #c3d2dd
selection_background  #17303c
selection_foreground  #dce7ee
url_color             #4f9fbf

# Paleta ANSI: acero, verde terminal y rojo de alerta
color0  #0a1015
color8  #3c5563
color1  #c83434
color9  #e05a5a
color2  #6fae8f
color10 #8cc7a8
color3  #c9a227
color11 #ddb84a
color4  #4f9fbf
color12 #7dbfda
color5  #8f7fbf
color13 #a99bd0
color6  #5f9ea8
color14 #85c6cf
color7  #c3d2dd
color15 #eaf2f7
