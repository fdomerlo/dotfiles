# ==============================================================================
# Fuzzel - Mr. Robot / fsociety
# Lanzador nativo Wayland: fondo casi negro, borde acero de 1px,
# esquinas rectas y selección en azul acero.
# ==============================================================================

[main]
font=JetBrains Mono:size=9
prompt="> "
placeholder=Buscar...
terminal=foot -e
icons-enabled=no
show-actions=no
fields=filename,name,generic,keywords,categories
width=54
lines=12
line-height=18
horizontal-pad=28
vertical-pad=22
inner-pad=14
image-size-ratio=0.6
layer=overlay
keyboard-focus=on-demand
exit-on-keyboard-focus-loss=yes

[colors]
background=05080bf7
text=c3d2ddff
prompt=4f9fbfff
placeholder=3c5563ff
input=c3d2ddff
match=c83434ff
selection=2e7491ff
selection-text=05080bff
selection-match=eaf2f7ff
counter=3c5563ff
border=2e7491ff

[border]
width=1
radius=0
