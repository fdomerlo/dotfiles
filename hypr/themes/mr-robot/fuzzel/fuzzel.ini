# ==============================================================================
# Fuzzel - Mr. Robot / fsociety
# Lanzador nativo Wayland: fondo casi negro, borde acero de 1px,
# esquinas rectas y selección en azul acero.
# ==============================================================================

[main]
font=JetBrains Mono:size=10
prompt="> "
placeholder=Buscar aplicaciones...
terminal=foot -e
icons-enabled=yes
show-actions=no
fields=filename,name,generic,keywords,categories
width=52
lines=12
horizontal-pad=16
vertical-pad=12
inner-pad=8
image-size-ratio=0.6
layer=overlay

[colors]
background=05080bf7
text=c3d2ddff
prompt=4f9fbfff
placeholder=3c5563ff
input=c3d2ddff
match=c83434ff
selection=2e7491ff
selection-text=05080bff
selection-match=eaf2f7ff
counter=3c5563ff
border=2e7491ff

[border]
width=1
radius=0
