# ==============================================================================
# Foot Terminal - Mr. Robot / fsociety
# ==============================================================================

[main]
font=JetBrains Mono:size=10
pad=12x12 center
initial-window-size-pixels=920x560
resize-delay-ms=50

[scrollback]
lines=10000

[cursor]
style=beam
blink=yes
color=05080b c83434

[colors]
alpha=0.97
background=05080b
foreground=c3d2dd
selection-foreground=dce7ee
selection-background=17303c
urls=4f9fbf

# Paleta ANSI: acero, verde terminal y rojo de alerta
regular0=0a1015
regular1=c83434
regular2=6fae8f
regular3=c9a227
regular4=4f9fbf
regular5=8f7fbf
regular6=5f9ea8
regular7=c3d2dd

bright0=3c5563
bright1=e05a5a
bright2=8cc7a8
bright3=ddb84a
bright4=7dbfda
bright5=a99bd0
bright6=85c6cf
bright7=eaf2f7
