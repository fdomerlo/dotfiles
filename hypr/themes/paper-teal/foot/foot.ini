# ==============================================================================
# Foot Terminal - Paper Teal
# ==============================================================================

[main]
font=JetBrains Mono:size=10
pad=12x12 center
initial-window-size-pixels=920x560
resize-delay-ms=50

[scrollback]
lines=10000

[cursor]
style=beam
blink=yes
color=f4f1e8 0f6b7a

[colors]
alpha=1.0
background=f4f1e8
foreground=1e2a30
selection-foreground=0b1f26
selection-background=cfe0da
urls=0f6b7a

# Paleta ANSI clara: tintas y acentos oscurecidos para conservar contraste
# sobre papel (no es una inversion de la paleta oscura).
regular0=2a3338
regular1=b3403a
regular2=2f6f4f
regular3=9a6b00
regular4=1f6f8b
regular5=7b5ea7
regular6=0f6b7a
regular7=5a6a72

bright0=5a6a72
bright1=c9544e
bright2=3f8a63
bright3=b07c0a
bright4=2e87a3
bright5=8f6fbf
bright6=2e9aa8
bright7=1e2a30
