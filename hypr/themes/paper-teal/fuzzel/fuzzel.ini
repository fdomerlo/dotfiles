# ==============================================================================
# Fuzzel - Paper Teal
# Lanzador nativo Wayland: fondo papel opaco, borde teal de 1px, esquinas
# apenas redondeadas y seleccion en teal petroleo con texto papel.
# ==============================================================================

[main]
font=JetBrains Mono:size=11
prompt="> "
placeholder=Buscar...
terminal=foot -e
icons-enabled=no
show-actions=no
fields=filename,name,generic,keywords,categories
width=54
lines=12
line-height=22
horizontal-pad=28
vertical-pad=22
inner-pad=14
image-size-ratio=0.6
layer=overlay
keyboard-focus=on-demand
exit-on-keyboard-focus-loss=yes

[colors]
background=fbf8f0ff
text=1e2a30ff
prompt=0f6b7aff
placeholder=8a9099ff
input=1e2a30ff
match=b3403aff
selection=0f6b7aff
selection-text=fbf8f0ff
selection-match=fffdf7ff
counter=8a9099ff
border=0f6b7aff

[border]
width=1
radius=4
