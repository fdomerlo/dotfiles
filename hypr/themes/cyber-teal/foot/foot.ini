# ==============================================================================
# Foot Terminal - Look & Feel PikaOS / Cyber-Teal
# ==============================================================================

[main]
font=JetBrains Mono:size=9.5
pad=12x12 center
initial-window-size-pixels=920x560
resize-delay-ms=50

[scrollback]
lines=10000

[cursor]
style=beam
blink=yes
color=0c1012 0db7d4

[colors]
alpha=0.96
background=0c1012
foreground=e6ece8
selection-foreground=e6ece8
selection-background=1e3a40
urls=0db7d4

# Paleta ANSI equilibrada para modo oscuro Cyber-Teal
regular0=1b2326
regular1=f7768e
regular2=73daca
regular3=e0af68
regular4=0db7d4
regular5=bb9af7
regular6=7dcfff
regular7=c0caf5

bright0=4a5c60
bright1=f7768e
bright2=73daca
bright3=e0af68
bright4=7aa2f7
bright5=bb9af7
bright6=7dcfff
bright7=ffffff
