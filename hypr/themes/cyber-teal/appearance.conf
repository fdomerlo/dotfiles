# ==============================================================================
# Apariencia, animaciones e input base (Look & Feel PikaOS / Cyber-Teal)
# ==============================================================================

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    # Borde activo oficial de PikaOS: degradado Cyan -> Cyber Blue -> Purple
    col.active_border = rgba(0db7d4ff) rgba(7aa2f7ff) rgba(9778d0ff) 45deg
    col.inactive_border = rgba(04404aaa)
    layout = dwindle
    resize_on_border = true
    allow_tearing = true
}

decoration {
    rounding = 8
    active_opacity = 1.0
    inactive_opacity = 0.95

    shadow {
        enabled = true
        range = 20
        render_power = 3
        offset = 0 6
        color = rgba(1a1a1acc)
        color_inactive = rgba(1a1a1a99)
    }

    blur {
        enabled = true
        size = 3
        passes = 3
        noise = 0.01
        contrast = 1.5
        brightness = 1.0
        vibrancy = 0.2
    }
}

animations {
    enabled = true
    # Curva Bézier oficial de PikaOS: fluent_decel
    bezier = fluent_decel, 0.1, 1.0, 0.0, 1.0
    animation = windows, 1, 4, fluent_decel, slide
    animation = windowsOut, 1, 4, fluent_decel, slide
    animation = windowsMove, 1, 4, fluent_decel
    animation = fade, 1, 4, fluent_decel
    animation = workspaces, 1, 6, fluent_decel, slide
    animation = layers, 1, 6, fluent_decel, slide
}

dwindle {
    preserve_split = true
    smart_resizing = true
}

misc {
    vrr = 1
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    focus_on_activate = true
    animate_manual_resizes = true
    animate_mouse_windowdragging = true
    # XDG_CURRENT_DESKTOP se define como "Hyprland:GNOME" en env.conf (intencional,
    # para los portales de GNOME). Esto silencia el aviso de "gestionado externamente".
    disable_xdg_env_checks = true
}

input {
    kb_layout = latam
    kb_variant =
    kb_model = pc105
    kb_options =
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
        tap-to-click = true
        tap-and-drag = true
        clickfinger_behavior = true
        disable_while_typing = true
        middle_button_emulation = false
    }
}

gestures {
    workspace_swipe_distance = 300
    workspace_swipe_invert = true
    workspace_swipe_min_speed_to_force = 30
    workspace_swipe_cancel_ratio = 0.5
    workspace_swipe_create_new = true
    workspace_swipe_direction_lock = true
    workspace_swipe_direction_lock_threshold = 10
    workspace_swipe_forever = true
}

# Gestos Touchpad estilo GNOME (Hyprland 0.55+)
# 3 dedos horizontal: cambio fluido 1:1 de escritorios (como en GNOME Shell)
gesture = 3, horizontal, workspace

# 3 dedos hacia arriba: lanzador de aplicaciones (equivalente a actividades GNOME)
gesture = 3, up, dispatcher, exec, ~/.config/hypr/scripts/toggle-menu.sh 'Buscar aplicaciones' env XDG_CURRENT_DESKTOP=Hyprland:GNOME fuzzel --placeholder 'Buscar aplicaciones...'

cursor {
    # Deshabilita cursores por hardware: evita el flickeo del puntero en setups multi-GPU o salidas en NVIDIA/Nouveau
    no_hardware_cursors = true
    # Evita que Hyprland sobreescriba el tema de cursor de GNOME en GSettings/dconf al volver a GNOME.
    sync_gsettings_theme = false
}
