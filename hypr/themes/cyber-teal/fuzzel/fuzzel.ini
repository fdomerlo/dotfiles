# ==============================================================================
# Fuzzel - Look & Feel PikaOS (Cyber-Teal Launcher)
# ==============================================================================

[main]
font=JetBrains Mono:size=10
prompt="> "
placeholder=Buscar aplicaciones...
terminal=foot -e
icons-enabled=yes
show-actions=no
fields=filename,name,generic,keywords,categories
width=52
lines=12
horizontal-pad=16
vertical-pad=14
inner-pad=8
image-size-ratio=0.6
layer=overlay

[colors]
background=0c1012f5
text=e6ece8ff
prompt=0db7d4ff
placeholder=4a5c60ff
input=e6ece8ff
match=73dacaff
selection=0db7d4ff
selection-text=0c1012ff
selection-match=0c1012ff
counter=4a5c60ff
border=0db7d4ff

[border]
width=2
radius=14
