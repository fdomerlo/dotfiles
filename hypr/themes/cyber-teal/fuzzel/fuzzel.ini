# ==============================================================================
# Fuzzel - Look & Feel PikaOS (Cyber-Teal Launcher)
# ==============================================================================

[main]
font=JetBrains Mono:size=8
prompt="> "
placeholder=Buscar...
terminal=foot -e
icons-enabled=no
show-actions=no
fields=filename,name,generic,keywords,categories
width=54
lines=12
line-height=16
horizontal-pad=28
vertical-pad=24
inner-pad=14
image-size-ratio=0.6
layer=overlay
keyboard-focus=on-demand
exit-on-keyboard-focus-loss=yes

[colors]
background=0c1012f5
text=e6ece8ff
prompt=0db7d4ff
placeholder=4a5c60ff
input=e6ece8ff
match=73dacaff
selection=0db7d4ff
selection-text=0c1012ff
selection-match=0c1012ff
counter=4a5c60ff
border=0db7d4ff

[border]
width=2
radius=14
