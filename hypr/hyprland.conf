# ==============================================================================
# Hyprland - Perfil opcional para Debian Stable
# ==============================================================================
# Este archivo se enlaza en ~/.config/hypr/hyprland.conf por `make hyprland`.
# La configuración está separada en conf/ para facilitar ajustes por equipo.

source = ~/.config/hypr/conf/env.conf
source = ~/.config/hypr/conf/monitors.conf
source = ~/.config/hypr/conf/workspaces.conf
source = ~/.config/hypr/conf/appearance.conf
source = ~/.config/hypr/conf/keybinds.conf
source = ~/.config/hypr/conf/windowrules.conf
source = ~/.config/hypr/conf/autostart.conf
