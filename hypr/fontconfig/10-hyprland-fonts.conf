<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- ==========================================================================
     Fontconfig para perfil Hyprland (solo tipografías empaquetadas en Debian)
     - Escritorio / UI:     Inter (fonts-inter)
     - Documentos:          Atkinson Hyperlegible (fonts-atkinson-hyperlegible)
     - Código / Terminal:   JetBrains Mono (fonts-jetbrains-mono)
     ========================================================================== -->
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Inter</family>
      <family>Noto Sans</family>
      <family>Symbols Nerd Font</family>
    </prefer>
  </alias>

  <alias>
    <family>system-ui</family>
    <prefer>
      <family>Inter</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>

  <alias>
    <family>document</family>
    <prefer>
      <family>Atkinson Hyperlegible</family>
      <family>Inter</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>

  <alias>
    <family>monospace</family>
    <prefer>
      <family>JetBrains Mono</family>
      <family>Symbols Nerd Font Mono</family>
      <family>Noto Sans Mono</family>
    </prefer>
  </alias>
</fontconfig>
