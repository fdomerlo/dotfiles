# ==============================================================================
# Hyprlock · Preset: Minimal Tech (Opción B - Candado circular + esquinas limpias)
# ==============================================================================

$font = JetBrains Mono
$icon_font = Symbols Nerd Font Mono

general {
    hide_cursor = true
    ignore_empty_input = true
    fail_timeout = 2000
}

animations {
    enabled = true
    bezier = easeOut, 0.22, 1, 0.36, 1
    animation = fadeIn, 1, 4, easeOut
    animation = fadeOut, 1, 3, easeOut
    animation = inputFieldDots, 1, 2, easeOut
    animation = inputFieldColors, 1, 3, easeOut
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 6
    contrast = 1.08
    brightness = 0.40
    vibrancy = 0.18
}

# Círculo exterior del candado
shape {
    monitor =
    size = 136, 136
    color = rgba(0c1012e6)
    rounding = -1
    border_size = 2
    border_color = rgba(0db7d4ff) rgba(7aa2f7ff) 45deg
    shadow_passes = 2
    shadow_size = 12
    shadow_color = rgba(080b0dcc)
    position = 0, 42
    halign = center
    valign = center
    zindex = 1
}

# Retícula circular interior
shape {
    monitor =
    size = 114, 114
    color = rgba(00000000)
    rounding = -1
    border_size = 1
    border_color = rgba(2a3834d9)
    position = 0, 42
    halign = center
    valign = center
    zindex = 1
}

# Ícono grande de candado
label {
    monitor =
    text = 󰌾
    color = rgba(0db7d4ff)
    font_size = 44
    font_family = $icon_font
    position = 0, 43
    halign = center
    valign = center
    zindex = 2
}

# Reloj
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(e6ece8ff)
    font_size = 64
    font_family = JetBrains Mono Bold
    position = 0, 215
    halign = center
    valign = center
    zindex = 2
}

# Fecha
label {
    monitor =
    text = cmd[update:60000] date +"%a %d %b %Y" | tr '[:lower:]' '[:upper:]'
    color = rgba(0db7d4ff)
    font_size = 12
    font_family = $font
    position = 0, 156
    halign = center
    valign = center
    zindex = 2
}

# Campo de contraseña
input-field {
    monitor =
    size = 340, 50
    outline_thickness = 2
    rounding = 12
    dots_size = 0.22
    dots_spacing = 0.24
    dots_center = true
    outer_color = rgba(0db7d4ff) rgba(7aa2f7ff) 45deg
    inner_color = rgba(0c1012f0)
    font_color = rgba(e6ece8ff)
    check_color = rgba(72d7b0ff)
    fail_color = rgba(e56b72ff)
    capslock_color = rgba(e0af68ff)
    fade_on_empty = false
    font_family = $font
    placeholder_text = Autenticación requerida
    check_text = Verificando...
    fail_text = Acceso denegado ($ATTEMPTS)
    hide_input = false
    position = 0, -96
    halign = center
    valign = center
    zindex = 2
}

# Usuario
label {
    monitor =
    text = cmd[update:60000] printf '%s@%s' "$USER" "$(hostname -s)"
    color = rgba(72d7b0ff)
    font_size = 13
    font_family = $font
    position = 0, -154
    halign = center
    valign = center
    zindex = 2
}

# Esquina superior izquierda limpia
label {
    monitor =
    text = cmd[update:4000] ~/.config/hypr/scripts/lock-telemetry.sh left
    color = rgba(91a39acc)
    font_size = 11
    font_family = $font
    text_align = left
    position = 28, -24
    halign = left
    valign = top
    zindex = 1
}

# Esquina superior derecha limpia
label {
    monitor =
    text = cmd[update:4000] ~/.config/hypr/scripts/lock-telemetry.sh right
    color = rgba(91a39acc)
    font_size = 11
    font_family = $font
    text_align = right
    position = -28, -24
    halign = right
    valign = top
    zindex = 1
}
