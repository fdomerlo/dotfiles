# ==============================================================================
# Hyprlock · Preset: Matrix SOC (Opción C - Tarjeta central + Feed completo)
# ==============================================================================

$font = JetBrains Mono
$icon_font = Symbols Nerd Font Mono

general {
    hide_cursor = true
    ignore_empty_input = true
    fail_timeout = 2000
}

animations {
    enabled = true
    bezier = easeOut, 0.22, 1, 0.36, 1
    animation = fadeIn, 1, 4, easeOut
    animation = fadeOut, 1, 3, easeOut
    animation = inputFieldDots, 1, 2, easeOut
    animation = inputFieldColors, 1, 3, easeOut
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
    contrast = 1.05
    brightness = 0.16
    vibrancy = 0.08
}

# Flanco izquierdo de monitoreo en vivo (zindex -1)
label {
    monitor =
    text = cmd[update:2500] ~/.config/hypr/scripts/lock-telemetry.sh matrix-l
    color = rgba(4f9fbf52)
    font_size = 10
    font_family = $font
    text_align = left
    position = 28, -28
    halign = left
    valign = top
    zindex = -1
}

# Flanco derecho de seguridad y procesos (zindex -1)
label {
    monitor =
    text = cmd[update:2500] ~/.config/hypr/scripts/lock-telemetry.sh matrix-r
    color = rgba(72d7b052)
    font_size = 10
    font_family = $font
    text_align = right
    position = -28, -28
    halign = right
    valign = top
    zindex = -1
}

# Tarjeta central de autenticación
shape {
    monitor =
    size = 440, 480
    color = rgba(05080bf0)
    rounding = 4
    border_size = 1
    border_color = rgba(4f9fbfff) rgba(0db7d4ff) 45deg
    shadow_passes = 3
    shadow_size = 22
    shadow_color = rgba(000000dd)
    position = 0, 0
    halign = center
    valign = center
    zindex = 0
}

# Reloj dentro de la tarjeta
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(eaf2f7ff)
    font_size = 56
    font_family = JetBrains Mono Bold
    position = 0, 174
    halign = center
    valign = center
    zindex = 2
}

# Fecha dentro de la tarjeta
label {
    monitor =
    text = cmd[update:60000] date +"%a %d %b %Y" | tr '[:lower:]' '[:upper:]'
    color = rgba(0db7d4ff)
    font_size = 11
    font_family = $font
    position = 0, 122
    halign = center
    valign = center
    zindex = 2
}

# Círculo exterior del candado
shape {
    monitor =
    size = 122, 122
    color = rgba(0a1015f0)
    rounding = -1
    border_size = 2
    border_color = rgba(0db7d4ff) rgba(72d7b0ff) 45deg
    position = 0, 26
    halign = center
    valign = center
    zindex = 1
}

# Retícula circular interior
shape {
    monitor =
    size = 102, 102
    color = rgba(00000000)
    rounding = -1
    border_size = 1
    border_color = rgba(1d3542d9)
    position = 0, 26
    halign = center
    valign = center
    zindex = 1
}

# Ícono grande de candado
label {
    monitor =
    text = 󰌾
    color = rgba(0db7d4ff)
    font_size = 40
    font_family = $icon_font
    position = 0, 27
    halign = center
    valign = center
    zindex = 2
}

# Estado de bloqueo
label {
    monitor =
    text = [ KERNEL SEC // AUTH REQUIRED ]
    color = rgba(5f7684ff)
    font_size = 11
    font_family = $font
    position = 0, -58
    halign = center
    valign = center
    zindex = 2
}

# Campo de contraseña
input-field {
    monitor =
    size = 340, 46
    outline_thickness = 1
    rounding = 0
    dots_size = 0.22
    dots_spacing = 0.24
    dots_center = true
    outer_color = rgba(4f9fbfff)
    inner_color = rgba(080d12ff)
    font_color = rgba(eaf2f7ff)
    check_color = rgba(72d7b0ff)
    fail_color = rgba(c83434ff)
    capslock_color = rgba(e0af68ff)
    fade_on_empty = false
    font_family = $font
    placeholder_text = [ Contraseña ]
    check_text = [ Verificando PAM... ]
    fail_text = [ Fallo de acceso · $ATTEMPTS ]
    hide_input = false
    position = 0, -110
    halign = center
    valign = center
    zindex = 2
}

# Usuario y equipo
label {
    monitor =
    text = cmd[update:60000] printf '%s@%s' "$USER" "$(hostname -s)"
    color = rgba(72d7b0ff)
    font_size = 12
    font_family = $font
    position = 0, -162
    halign = center
    valign = center
    zindex = 2
}

# Pie de tarjeta
label {
    monitor =
    text = [ PRESET // MATRIX-SOC · HYPRLOCK ]
    color = rgba(5f768499)
    font_size = 10
    font_family = $font
    position = 0, -206
    halign = center
    valign = center
    zindex = 2
}
