# ==============================================================================
# Hyprlock · Preset: SOC Console (Telemetría + Feed progresivo arriba a la derecha)
# ==============================================================================

$font = JetBrains Mono
$icon_font = Symbols Nerd Font Mono

general {
    hide_cursor = true
    ignore_empty_input = true
    fail_timeout = 2000
}

animations {
    enabled = true
    bezier = easeOut, 0.22, 1, 0.36, 1
    animation = fadeIn, 1, 4, easeOut
    animation = fadeOut, 1, 3, easeOut
    animation = inputFieldDots, 1, 2, easeOut
    animation = inputFieldColors, 1, 3, easeOut
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 5
    contrast = 1.06
    brightness = 0.24
    vibrancy = 0.10
}

# Círculo exterior del candado
shape {
    monitor =
    size = 136, 136
    color = rgba(05080be8)
    rounding = -1
    border_size = 2
    border_color = rgba(0db7d4ff) rgba(c83434ff) 45deg
    shadow_passes = 2
    shadow_size = 14
    shadow_color = rgba(04070acc)
    position = 0, 52
    halign = center
    valign = center
    zindex = 1
}

# Retícula circular interior
shape {
    monitor =
    size = 114, 114
    color = rgba(00000000)
    rounding = -1
    border_size = 1
    border_color = rgba(1d3542d9)
    position = 0, 52
    halign = center
    valign = center
    zindex = 1
}

# Ícono grande de candado
label {
    monitor =
    text = 󰌾
    color = rgba(0db7d4ff)
    font_size = 44
    font_family = $icon_font
    position = 0, 53
    halign = center
    valign = center
    zindex = 2
}

# Reloj
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(eaf2f7ff)
    font_size = 60
    font_family = JetBrains Mono Bold
    position = 0, 220
    halign = center
    valign = center
    zindex = 2
}

# Fecha
label {
    monitor =
    text = cmd[update:60000] date +"%a %d %b %Y" | tr '[:lower:]' '[:upper:]'
    color = rgba(4f9fbfff)
    font_size = 12
    font_family = $font
    position = 0, 164
    halign = center
    valign = center
    zindex = 2
}

# Estado debajo del candado
label {
    monitor =
    text = [ SOC // SESSION LOCKED · PAM_UNIX ARMED ]
    color = rgba(72d7b0cc)
    font_size = 11
    font_family = $font
    position = 0, -40
    halign = center
    valign = center
    zindex = 2
}

# Campo de contraseña
input-field {
    monitor =
    size = 350, 48
    outline_thickness = 1
    rounding = 0
    dots_size = 0.22
    dots_spacing = 0.24
    dots_center = true
    outer_color = rgba(0db7d4ff)
    inner_color = rgba(05080bf2)
    font_color = rgba(e6ece8ff)
    check_color = rgba(72d7b0ff)
    fail_color = rgba(c83434ff)
    capslock_color = rgba(e0af68ff)
    fade_on_empty = false
    font_family = $font
    placeholder_text = [ Ingresar credenciales ]
    check_text = [ PAM verifying... ]
    fail_text = [ AUTH FAILED · $ATTEMPTS ]
    hide_input = false
    position = 0, -94
    halign = center
    valign = center
    zindex = 2
}

# Usuario y equipo
label {
    monitor =
    text = cmd[update:60000] printf '%s@%s' "$USER" "$(hostname -s)"
    color = rgba(4f9fbfff)
    font_size = 13
    font_family = $font
    position = 0, -148
    halign = center
    valign = center
    zindex = 2
}

# Toda la telemetría + feed progresivo en la esquina superior derecha
label {
    monitor =
    text = cmd[update:1500] ~/.config/hypr/scripts/lock-telemetry.sh soc-feed
    color = rgba(72d7b0b8)
    font_size = 10
    font_family = $font
    text_align = right
    position = -28, -24
    halign = right
    valign = top
    zindex = 1
}

# Identificador de preset
label {
    monitor =
    text = [ PRESET // SOC-CONSOLE ]
    color = rgba(5f768499)
    font_size = 10
    font_family = $font
    text_align = right
    position = -28, 22
    halign = right
    valign = bottom
    zindex = -1
}
