# Wallpaper estático para arranques manuales de hyprpaper.
# `wallpaper.sh` genera su propia configuración temporal para respetar
# la variable HYPR_WALLPAPER; este archivo queda como referencia.
#
# Formato requerido por hyprpaper >= 0.8 (bloques `wallpaper`).

splash = false

wallpaper {
    monitor =
    path = ~/.config/hypr/wallpapers/default.png
    fit_mode = cover
}
