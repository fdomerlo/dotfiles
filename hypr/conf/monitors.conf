# Layout de monitores.
# Se usan nombres de conector (no modelo/serie) para no depender del monitor.
# Si en otra PC los conectores se llaman distinto, ajustar estas líneas.
#
# Izquierda: HDMI-A-1
# Derecha:   HDMI-A-2
#
# Para intercambiar el orden físico, invertir los nombres de las dos reglas
# (o intercambiar los cables). Ver salidas disponibles con: hyprctl monitors
#
# La escala (cuarto campo) es un zoom lógico por salida, no un ajuste
# automático de densidad. Si los monitores tienen distinto PPI y querés que
# el texto se vea del mismo tamaño físico en ambos, ejecutá
# `hypr/scripts/monitor-scale.sh` y reemplazá el 1 por la escala sugerida
# (por ejemplo 1.20 en un 27" 1440p junto a un 24" 1080p en 1.0).

monitor = HDMI-A-1, preferred, 0x0, 1
monitor = HDMI-A-2, preferred, auto-right, 1

# El estándar de tamaño de texto es el panel interno de la ThinkPad E15 Gen 2
# (15.6" 1080p, ~141 PPI) a escala 1.0. Un monitor de 24" 1080p (~92 PPI)
# muestra el mismo texto ~1.53x más grande a esa escala, así que se baja:
#   igualar exacto: 92.4 / 141 ≈ 0.655  (2/3 = 0.6667, texto idéntico)
#   0.75: texto ~15% más grande, con bastante menos suavidad
#   0.8:  texto ~22% más grande, la más nítida de las tres
# Se usa 0.75 como compromiso. Ojo: las escalas < 1 se dibujan con menos
# píxeles físicos (el texto se ve algo más suave) y algunos toolkits las
# ignoran; `fuzzel` es uno, por eso su tamaño en pt está calibrado para
# quedar cerca tanto acá como en la ThinkPad.
monitor = DP-1, preferred, auto, 0.75

# Fallback para cualquier salida que no tenga una regla explícita.
monitor = ,preferred,auto,1
