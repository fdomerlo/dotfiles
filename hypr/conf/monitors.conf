# Layout portable: cada salida usa su modo preferido y escala 1.
# Para fijar un monitor concreto, reemplazar por reglas explícitas:
#
# monitor = DP-1, 2560x1440@144, 0x0, 1
# monitor = HDMI-A-1, 1920x1080@60, 2560x0, 1
#
# Ver salidas disponibles con: hyprctl monitors

monitor = ,preferred,auto,1
