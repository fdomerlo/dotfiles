# ==============================================================================
# Workspaces fijos por monitor (dos pantallas).
#
# Izquierda (HDMI-A-1): 1-5
# Derecha   (HDMI-A-2): 6-0 (6, 7, 8, 9 y 10)
#
# Así Super+1..5 siempre enfocan el monitor izquierdo y Super+6..0 el derecho,
# sin depender de cuál tenga el foco en ese momento.
#
# La visibilidad de los workspaces vacíos la maneja Waybar
# (persistent-workspaces por salida), no Hyprland: no mezclar ambas.
# ==============================================================================

# Monitor izquierdo
workspace = 1, monitor:HDMI-A-1, default:true
workspace = 2, monitor:HDMI-A-1
workspace = 3, monitor:HDMI-A-1
workspace = 4, monitor:HDMI-A-1
workspace = 5, monitor:HDMI-A-1

# Monitor derecho
workspace = 6, monitor:HDMI-A-2, default:true
workspace = 7, monitor:HDMI-A-2
workspace = 8, monitor:HDMI-A-2
workspace = 9, monitor:HDMI-A-2
workspace = 10, monitor:HDMI-A-2
