# ==============================================================================
# Manipulación avanzada con mouse y soporte de plugins (módulo aislado).
# Cargado desde hyprland.conf antes de local.conf para permitir overrides por
# estación.
# ==============================================================================

# 1. Ergonomía nativa de ventanas con mouse (Hyprland 0.55+, sin ABI externo)
general {
    resize_on_border = true
    extend_border_grab_area = 15
    hover_icon_on_border = true
}

binds {
    # Evita arrastrar ventanas accidentalmente con toques breves de Super+Click.
    drag_threshold = 10
}

# Complementos a los bindm base (Super+Click Izq/Der ya definidos en keybinds.conf):
# - Super + Alt + Click Izq: redimensionar (cómodo en touchpads sin botón derecho)
# - Super + Click Medio:     alternar ventana flotante / mosaico
# - Super + Rueda:           recorrer workspaces entre monitores
bindm = $mod ALT, mouse:272, resizewindow
bind = $mod, mouse:274, togglefloating
bind = $mod, mouse_down, exec, ~/.config/hypr/scripts/workspace-cycle.sh next
bind = $mod, mouse_up, exec, ~/.config/hypr/scripts/workspace-cycle.sh prev

