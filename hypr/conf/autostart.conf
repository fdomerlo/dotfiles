# Servicios y aplicaciones que se inician con la sesión.

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_DATA_DIRS
exec-once = gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'
exec-once = gsettings set org.gnome.desktop.interface gtk-theme 'Adwaita-dark'
exec-once = gsettings set org.gnome.desktop.interface icon-theme 'Papirus-Dark'
exec-once = ~/.config/hypr/scripts/start-waybar.sh
# Centro de notificaciones (swaync) con respaldo en mako si no está instalado.
exec-once = sh -c 'command -v swaync >/dev/null 2>&1 && exec swaync; command -v mako >/dev/null 2>&1 && exec mako'
# OSD de volumen y brillo (opcional).
exec-once = sh -c 'command -v swayosd-server >/dev/null 2>&1 && exec swayosd-server'
exec-once = hypridle
exec-once = systemctl --user start hyprpolkitagent.service
exec-once = ~/.config/hypr/scripts/wallpaper.sh --daemon
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = nm-applet --indicator
exec-once = blueman-applet
