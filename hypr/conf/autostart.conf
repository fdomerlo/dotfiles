# Servicios y aplicaciones que se inician con la sesión.

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_DATA_DIRS SSH_AUTH_SOCK
# Keyring y secretos (GNOME Keyring: desbloqueado automáticamente desde GDM)
exec-once = sh -c 'command -v gnome-keyring-daemon >/dev/null 2>&1 && gnome-keyring-daemon --start --components=secrets,ssh >/dev/null 2>&1'
# Servidor de terminal Foot para apertura instantánea (<10 ms)
exec-once = sh -c 'command -v foot >/dev/null 2>&1 && exec foot --server'
# Ciclo de vida de la sesión systemd: los portales son PartOf de este target.
# Iniciarlo en Hyprland y detenerlo al salir evita que un xdg-desktop-portal
# con el entorno de Hyprland sobreviva y lo herede la siguiente sesión GNOME.
exec-once = systemctl --user start graphical-session.target
exec-shutdown = systemctl --user stop graphical-session.target
exec-once = gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'
exec-once = gsettings set org.gnome.desktop.interface gtk-theme 'Adwaita'
# Workspaces: 5 por monitor, asignados en caliente según las salidas conectadas
# (1-5, 6-10, …). Con --watch se re-aplica al conectar/desconectar un monitor.
# Va antes de Waybar para que los workspaces existan cuando la barra conecte.
exec-once = ~/.config/hypr/scripts/workspaces-init.sh --watch
# Los iconos se heredan del sistema (GNOME/KDE) para mantener consistencia entre sesiones.
exec-once = ~/.config/hypr/scripts/start-waybar.sh
# Overview tipo Activities (Quickshell en segundo plano, responde por IPC a Super+A).
exec-once = sh -c 'command -v qs >/dev/null 2>&1 && qs -n -d'
# Centro de notificaciones (swaync).
exec-once = sh -c 'command -v swaync >/dev/null 2>&1 && exec swaync'
# Caché de estado del panel para el toggle del icono de notificaciones.
exec-once = ~/.config/hypr/scripts/swaync-state.sh
# OSD de volumen y brillo (opcional).
exec-once = sh -c 'command -v swayosd-server >/dev/null 2>&1 && exec swayosd-server'
# Filtro de luz azul (luz nocturna). Arranca neutro; el toggle aplica 4000K.
exec-once = sh -c 'command -v hyprsunset >/dev/null 2>&1 && exec hyprsunset -t 6500'
exec-once = hypridle
exec-once = systemctl --user start hyprpolkitagent.service
exec-once = ~/.config/hypr/scripts/wallpaper.sh --daemon
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
# La red se muestra en el módulo network de Waybar. nm-applet duplicaba el
# indicador en la bandeja; para conexiones nuevas usar nm-connection-editor o nmcli.
# Bluetooth: el estado vive en el módulo bluetooth de Waybar (clic abre
# blueman-manager). No se lanza blueman-applet para evitar el ícono duplicado
# en la bandeja.
