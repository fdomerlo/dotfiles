# ==============================================================================
# Reglas de ventanas y optimizaciones gaming (Look & Feel PikaOS).
# Sintaxis vigente de Hyprland 0.55+ (windowrule v3).
# ==============================================================================

# Waybar debe quedar por encima del panel de swaync (mismo nivel "top").
# Sin esto, la superficie a pantalla completa del panel tapa la barra y sus
# clics no llegan a Waybar mientras el centro de notificaciones está abierto.
layerrule = order -1, match:namespace ^(waybar)$

# Diálogos y paneles de configuración flotantes
windowrule = match:class ^(pavucontrol)$, float on
windowrule = match:class ^(pavucontrol)$, size 900 600
windowrule = match:class ^(nm-connection-editor)$, float on
windowrule = match:class ^(nm-connection-editor)$, size 900 600
windowrule = match:class ^(blueman-manager)$, float on
windowrule = match:class ^(blueman-manager)$, size 900 600
windowrule = match:class ^(org\.gnome\.seahorse\.Application|seahorse)$, float on
windowrule = match:class ^(org\.gnome\.seahorse\.Application|seahorse)$, size 950 620
windowrule = match:class ^(org\.gnome\.Calculator|gnome-calculator)$, float on
windowrule = match:class ^(org\.gnome\.Calculator|gnome-calculator)$, center on
windowrule = match:class ^(org\.gnome\.Calculator|gnome-calculator)$, size 420 560
windowrule = match:class ^(hyprpolkitagent)$, float on
windowrule = match:class ^(hyprpolkitagent)$, center on
windowrule = match:class ^(swappy)$, float on
windowrule = match:class ^(swappy)$, center on
windowrule = match:class ^(file-roller|ark)$, float on

# TUIs modales flotantes y centradas (lazydocker, yazi dedicado).
# btop queda fuera a propósito: es un dashboard y se lee mejor tileado
# (se lanza sin --app-id, así hereda la clase «foot» y entra en tiling).
# El tamaño lo aplica tui-float.sh: foot fija su propio tamaño inicial y su
# primer commit gana sobre esta regla, por eso el script pasa el 85% del
# monitor con --window-size-pixels. El size queda como fallback para clientes
# que sí respetan la regla.
windowrule = match:class ^(tui-float)$, float on
windowrule = match:class ^(tui-float)$, center on
windowrule = match:class ^(tui-float)$, size 85% 85%
windowrule = match:class ^(tui-float)$, dim_around on

# Scratchpad: terminal flotante en el workspace especial "magic"
windowrule = match:class ^(scratchpad)$, workspace special:magic silent
windowrule = match:class ^(scratchpad)$, float on
windowrule = match:class ^(scratchpad)$, size 1000 600
windowrule = match:class ^(scratchpad)$, center on

# Reglas Gaming (PikaOS: Steam, Gamescope, juegos nativos y Proton)
# Sin idle_inhibit automático: el único inhibidor del ciclo de energía es el
# botón idle_inhibitor en Waybar.
windowrule = match:class ^(steamwebhelper)$, float on
windowrule = match:title ^(Friends List)$, float on
windowrule = match:class ^(steam_app_.*)$, fullscreen on
windowrule = match:class ^(steam_app_.*)$, immediate on

# Picture-in-Picture
windowrule = match:title ^(Picture-in-Picture)$, float on
windowrule = match:title ^(Picture-in-Picture)$, pin on
windowrule = match:title ^(Picture-in-Picture)$, size 480 270

# Reglas de Web Apps (PWAs) generadas localmente por webapp-install.sh (no versionado)
source = ~/.config/hypr/conf/webapps.conf
