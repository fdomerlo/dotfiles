# ==============================================================================
# Reglas de ventanas y optimizaciones gaming (Look & Feel PikaOS).
# Sintaxis vigente de Hyprland 0.55+ (windowrule v3).
# ==============================================================================

# Diálogos y paneles de configuración flotantes
windowrule = match:class ^(pavucontrol)$, float on
windowrule = match:class ^(pavucontrol)$, size 900 600
windowrule = match:class ^(nm-connection-editor)$, float on
windowrule = match:class ^(nm-connection-editor)$, size 900 600
windowrule = match:class ^(blueman-manager)$, float on
windowrule = match:class ^(blueman-manager)$, size 900 600
windowrule = match:class ^(file-roller|ark)$, float on

# Reglas Gaming (PikaOS: Steam, Gamescope, juegos nativos y Proton)
windowrule = match:class ^(steamwebhelper)$, float on
windowrule = match:title ^(Friends List)$, float on
windowrule = match:class ^(gamescope)$, idleinhibit always
windowrule = match:class ^(steam_app_.*)$, fullscreen on
windowrule = match:class ^(steam_app_.*)$, idleinhibit always
windowrule = match:class ^(steam_app_.*)$, immediate on

# Picture-in-Picture
windowrule = match:title ^(Picture-in-Picture)$, float on
windowrule = match:title ^(Picture-in-Picture)$, pin on
windowrule = match:title ^(Picture-in-Picture)$, size 480 270
