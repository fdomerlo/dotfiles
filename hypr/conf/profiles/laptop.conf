# ==============================================================================
# Perfil local de estación: LAPTOP / NOTEBOOK (plantilla para ~/.config/hypr/conf/local.conf)
# Cargado al final de hyprland.conf; no está versionado por máquina.
# ==============================================================================

# Pantalla integrada de notebook (ajustar escala a 1.25 / 1.5 en paneles HiDPI):
monitor = eDP-1, preferred, 0x0, 1
# Monitor externo opcional encima o a la derecha del panel integrado:
# monitor = HDMI-A-1, preferred, auto-right, 1

# Modo clamshell / tapa cerrada (requiere hyprlock):
bindl = , switch:on:Lid Switch, exec, hyprlock --immediate
bindl = , switch:off:Lid Switch, exec, hyprctl dispatch dpms on

# Ajustes opcionales de touchpad para notebook:
# input {
#     touchpad {
#         natural_scroll = true
#         tap-to-click = true
#         disable_while_typing = true
#     }
# }
