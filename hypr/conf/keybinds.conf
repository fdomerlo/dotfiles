# ==============================================================================
# Atajos de teclado (Look & Feel y ergonomía PikaOS). $mod = Super.
# ==============================================================================

$mod = SUPER
$terminal = foot
$menu = env XDG_CURRENT_DESKTOP=Hyprland:GNOME fuzzel --placeholder 'Buscar aplicaciones...'
$menuToggle = ~/.config/hypr/scripts/toggle-menu.sh
$fileManager = nautilus
$browser = flatpak run org.mozilla.firefox

# Aplicaciones principales
bind = $mod, Return, exec, $terminal
bind = $mod SHIFT, Return, exec, $terminal -e tmux new-session -A -s main
# Un solo toque de Super muestra/oculta el lanzador (mismo gesto que GNOME).
bindr = $mod, SUPER_L, exec, $menuToggle 'Buscar aplicaciones' $menu
bind = $mod, D, exec, $menuToggle 'Buscar aplicaciones' $menu
bind = $mod, Space, exec, $menuToggle 'Buscar aplicaciones' $menu
# Overview tipo Activities (Quickshell): grilla de workspaces + previews en vivo
bind = $mod, A, exec, ~/.config/hypr/scripts/overview-toggle.sh
bind = $mod, E, exec, $fileManager
bind = $mod SHIFT, F, exec, $fileManager
bind = $mod, Y, exec, $terminal -e yazi
bind = $mod, B, exec, $browser
bind = $mod SHIFT, B, exec, $browser
bind = $mod, W, exec, ~/.config/hypr/scripts/wallpaper.sh --next

# Búsqueda y acciones rápidas
bind = $mod, equal, exec, gnome-calculator
bind = $mod CTRL, F, exec, $menuToggle 'Archivo:' ~/.config/hypr/scripts/file-search.sh
bind = $mod SHIFT, P, exec, ~/.config/hypr/scripts/color-picker.sh
bind = $mod CTRL, O, exec, ~/.config/hypr/scripts/ocr-region.sh

# Intercambiador de temas (Mr. Robot / Cyber-Teal).
bind = $mod SHIFT, T, exec, $menuToggle 'Temas' ~/.config/hypr/scripts/theme-switch.sh menu

# Descubrimiento: cheatsheet de atajos activos.
# En latam "/" es Shift+7 y colisiona con movetoworkspacesilent 7; usamos F1.
bind = $mod, F1, exec, $menuToggle 'Atajos' ~/.config/hypr/scripts/keybinds.sh

# Gestión de ventanas
bind = $mod, Q, killactive,
bind = $mod CTRL, Q, exec, hyprctl kill
bind = $mod, F, fullscreen,
bind = $mod, M, fullscreen, 1
bind = $mod, S, togglefloating,
bind = $mod SHIFT, Space, togglefloating,
bind = $mod, L, exec, hyprlock
bind = $mod, Escape, exec, hyprctl reload
bind = $mod SHIFT, Q, exit,
bind = $mod SHIFT, E, exit,
bind = $mod, V, exec, $menuToggle 'Portapapeles' ~/.config/hypr/scripts/clipboard.sh
bind = $mod SHIFT, V, exec, $menuToggle 'Portapapeles' ~/.config/hypr/scripts/clipboard.sh

# Cambio de ventanas estilo GNOME
bind = ALT, Tab, cyclenext
bind = ALT SHIFT, Tab, cyclenext, prev
bind = ALT, grave, focuscurrentorlast

# Scratchpad (terminal flotante persistente)
bind = $mod, grave, exec, ~/.config/hypr/scripts/scratchpad.sh
bind = $mod SHIFT, grave, movetoworkspacesilent, special:magic

# Grupos de ventanas (tabs dentro de una misma ventana)
bind = $mod, G, togglegroup
bind = $mod, Tab, changegroupactive
bind = $mod SHIFT, Tab, changegroupactive, b
bind = $mod CTRL, G, moveintogroup, l
bind = $mod SHIFT, G, moveoutofgroup

# Notificaciones (swaync)
bind = $mod, N, exec, swaync-client -t -sw
bind = $mod SHIFT, N, exec, swaync-client -d -sw

# Luz nocturna (filtro de luz azul de hyprsunset)
bind = $mod CTRL, N, exec, ~/.config/hypr/scripts/nightlight-toggle.sh

# Capturas de pantalla (Print abre swappy para anotar; Ctrl+Print copia directo)
bind = , Print, exec, ~/.config/hypr/scripts/screenshot-region.sh
bind = CTRL, Print, exec, ~/.config/hypr/scripts/screenshot-region.sh --raw
bind = SHIFT, Print, exec, ~/.config/hypr/scripts/screenshot-full.sh

# Grabación de pantalla (alterna inicio/parada; el indicador aparece en Waybar)
bind = $mod SHIFT, R, exec, ~/.config/hypr/scripts/screen-record.sh

# Workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

# Workspaces desde el teclado numérico (NumLock activado)
bind = $mod, KP_1, workspace, 1
bind = $mod, KP_2, workspace, 2
bind = $mod, KP_3, workspace, 3
bind = $mod, KP_4, workspace, 4
bind = $mod, KP_5, workspace, 5
bind = $mod, KP_6, workspace, 6
bind = $mod, KP_7, workspace, 7
bind = $mod, KP_8, workspace, 8
bind = $mod, KP_9, workspace, 9
bind = $mod, KP_0, workspace, 10

# Workspaces desde el teclado numérico (NumLock desactivado)
bind = $mod, KP_End, workspace, 1
bind = $mod, KP_Down, workspace, 2
bind = $mod, KP_Next, workspace, 3
bind = $mod, KP_Left, workspace, 4
bind = $mod, KP_Begin, workspace, 5
bind = $mod, KP_Right, workspace, 6
bind = $mod, KP_Home, workspace, 7
bind = $mod, KP_Up, workspace, 8
bind = $mod, KP_Prior, workspace, 9
bind = $mod, KP_Insert, workspace, 10

# Mover sin seguir la ventana (equivalente a GNOME)
bind = $mod SHIFT, 1, movetoworkspacesilent, 1
bind = $mod SHIFT, 2, movetoworkspacesilent, 2
bind = $mod SHIFT, 3, movetoworkspacesilent, 3
bind = $mod SHIFT, 4, movetoworkspacesilent, 4
bind = $mod SHIFT, 5, movetoworkspacesilent, 5
bind = $mod SHIFT, 6, movetoworkspacesilent, 6
bind = $mod SHIFT, 7, movetoworkspacesilent, 7
bind = $mod SHIFT, 8, movetoworkspacesilent, 8
bind = $mod SHIFT, 9, movetoworkspacesilent, 9
bind = $mod SHIFT, 0, movetoworkspacesilent, 10

# Mover al workspace desde el teclado numérico (NumLock activado)
bind = $mod SHIFT, KP_1, movetoworkspacesilent, 1
bind = $mod SHIFT, KP_2, movetoworkspacesilent, 2
bind = $mod SHIFT, KP_3, movetoworkspacesilent, 3
bind = $mod SHIFT, KP_4, movetoworkspacesilent, 4
bind = $mod SHIFT, KP_5, movetoworkspacesilent, 5
bind = $mod SHIFT, KP_6, movetoworkspacesilent, 6
bind = $mod SHIFT, KP_7, movetoworkspacesilent, 7
bind = $mod SHIFT, KP_8, movetoworkspacesilent, 8
bind = $mod SHIFT, KP_9, movetoworkspacesilent, 9
bind = $mod SHIFT, KP_0, movetoworkspacesilent, 10

# Mover al workspace desde el teclado numérico (NumLock desactivado)
bind = $mod SHIFT, KP_End, movetoworkspacesilent, 1
bind = $mod SHIFT, KP_Down, movetoworkspacesilent, 2
bind = $mod SHIFT, KP_Next, movetoworkspacesilent, 3
bind = $mod SHIFT, KP_Left, movetoworkspacesilent, 4
bind = $mod SHIFT, KP_Begin, movetoworkspacesilent, 5
bind = $mod SHIFT, KP_Right, movetoworkspacesilent, 6
bind = $mod SHIFT, KP_Home, movetoworkspacesilent, 7
bind = $mod SHIFT, KP_Up, movetoworkspacesilent, 8
bind = $mod SHIFT, KP_Prior, movetoworkspacesilent, 9
bind = $mod SHIFT, KP_Insert, movetoworkspacesilent, 10

# Ciclo de workspaces entre monitores (con wrap global: 1..N*5).
# Page_Down/Page_Up recorren los workspaces cubriendo todos los monitores.
bind = $mod, Page_Down, exec, ~/.config/hypr/scripts/workspace-cycle.sh next
bind = $mod, Page_Up, exec, ~/.config/hypr/scripts/workspace-cycle.sh prev
bind = $mod SHIFT, Page_Down, exec, ~/.config/hypr/scripts/workspace-cycle.sh next --move
bind = $mod SHIFT, Page_Up, exec, ~/.config/hypr/scripts/workspace-cycle.sh prev --move

# Foco de ventanas (flechas y vim-keys)
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d
bind = $mod, h, movefocus, l
bind = $mod, l, movefocus, r
bind = $mod, k, movefocus, u
bind = $mod, j, movefocus, d

# Mover ventanas
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, down, movewindow, d

# Redimensionar
bind = $mod CTRL, left, resizeactive, -40 0
bind = $mod CTRL, right, resizeactive, 40 0
bind = $mod CTRL, up, resizeactive, 0 -40
bind = $mod CTRL, down, resizeactive, 0 40

# Movimiento y redimensionado con mouse
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Audio (OSD de swayosd; respaldo directo con wpctl si no está disponible)
bindel = , XF86AudioRaiseVolume, exec, ~/.config/hypr/scripts/osd.sh volume raise
bindel = , XF86AudioLowerVolume, exec, ~/.config/hypr/scripts/osd.sh volume lower
bindl = , XF86AudioMute, exec, ~/.config/hypr/scripts/osd.sh volume mute
bindl = , XF86AudioMicMute, exec, ~/.config/hypr/scripts/osd.sh mic mute

# Brillo (OSD de swayosd; respaldo directo con brightnessctl)
bindel = , XF86MonBrightnessUp, exec, ~/.config/hypr/scripts/osd.sh brightness raise
bindel = , XF86MonBrightnessDown, exec, ~/.config/hypr/scripts/osd.sh brightness lower

# Controles Multimedia
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86AudioStop, exec, playerctl stop
