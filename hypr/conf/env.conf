# Entorno de la sesión Hyprland.
# Cursor único en Hyprland, XWayland, GTK y Qt: Adwaita 24 px.
# Se usa el mismo tema que GNOME (gsettings) para evitar que el puntero cambie
# entre ventanas nativas y aplicaciones GTK/Electron.

env = PATH,$HOME/.local/bin:$PATH
env = XDG_CURRENT_DESKTOP,Hyprland:GNOME
env = XDG_DATA_DIRS,$HOME/.local/share:$HOME/.local/share/flatpak/exports/share:/var/lib/flatpak/exports/share:/usr/local/share/:/usr/share/
env = XCURSOR_THEME,Adwaita
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,Adwaita
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct
env = GDK_BACKEND,wayland,x11
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = MOZ_ENABLE_WAYLAND,1
# No se fija GTK_THEME: es una variable de depuración que solo heredan las apps
# lanzadas desde Hyprland (no las de systemd/portales ni siempre las Flatpak) y
# hace que cada vía resuelva el tema distinto. El tema se define en GSettings
# (gtk-theme=Adwaita + color-scheme=prefer-dark) y en gtk-3.0/gtk-4.0
# settings.ini, que es lo que leen todos los toolkits por igual.
