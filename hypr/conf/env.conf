# Entorno de la sesión Hyprland.
# Cursor único en Hyprland, XWayland, GTK y Qt: Adwaita 24 px.
# Se usa el mismo tema que GNOME (gsettings) para evitar que el puntero cambie
# entre ventanas nativas y aplicaciones GTK/Electron.

env = PATH,/home/fdomerlo/.local/bin:$PATH
env = XDG_CURRENT_DESKTOP,Hyprland:GNOME
env = XDG_DATA_DIRS,/home/fdomerlo/.local/share:/home/fdomerlo/.local/share/flatpak/exports/share:/var/lib/flatpak/exports/share:/usr/local/share/:/usr/share/
env = XCURSOR_THEME,Adwaita
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,Adwaita
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct
env = GDK_BACKEND,wayland,x11
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = MOZ_ENABLE_WAYLAND,1
env = GTK_THEME,Adwaita-dark
