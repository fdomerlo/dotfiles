# ==============================================================================
# Apariencia, animaciones Material 3 e input base (Tema único Cyber-Teal M3)
# Los colores por polaridad (dark / light) viven en hypr/themes/<modo>/colors.conf
# y se cargan al final mediante ~/.config/hypr/conf/colors.conf.
# ==============================================================================

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 1
    layout = dwindle
    resize_on_border = true
    allow_tearing = true
}

decoration {
    rounding = 12
    active_opacity = 1.0
    inactive_opacity = 0.94

    shadow {
        enabled = true
        range = 22
        render_power = 3
        offset = 0 6
    }

    blur {
        enabled = true
        size = 6
        passes = 3
        noise = 0.01
    }
}

animations {
    enabled = true
    # Curvas Material 3 suaves y fluidas (sin cortes abruptos)
    bezier = m3_decel, 0.05, 0.7, 0.1, 1.0
    bezier = m3_soft, 0.16, 1.0, 0.3, 1.0
    bezier = m3_std, 0.2, 0.0, 0.0, 1.0

    animation = windows, 1, 4.5, m3_decel, popin 86%
    animation = windowsOut, 1, 3.6, m3_soft, popin 90%
    animation = windowsMove, 1, 4.2, m3_decel
    animation = fade, 1, 4, m3_soft
    animation = workspaces, 1, 5, m3_decel, slide
    animation = specialWorkspace, 1, 4.5, m3_decel, slidevert
    animation = layers, 1, 3.8, m3_decel, fade
}

# Smart Gaps ("no gaps when only"): cuando hay una sola ventana visible en
# tiling (w[tv1]) o maximizada (f[1]), elimina márgenes, bordes y redondeo
# para que ocupe de borde a borde bajo la barra superior.
workspace = w[tv1], gapsout:0, gapsin:0
workspace = f[1], gapsout:0, gapsin:0
windowrule = match:float false, match:workspace w[tv1], border_size 0
windowrule = match:float false, match:workspace w[tv1], rounding 0
windowrule = match:float false, match:workspace f[1], border_size 0
windowrule = match:float false, match:workspace f[1], rounding 0

# Pulido visual de capas Wayland (Hyprland 0.55+: superficies Quickshell + Fuzzel)
layerrule = blur on, match:namespace ^(quickshell-bar)$
layerrule = ignore_alpha 0.2, match:namespace ^(quickshell-bar)$
layerrule = blur_popups on, match:namespace ^(quickshell-bar)$
layerrule = animation slide top, match:namespace ^(quickshell-bar)$

layerrule = blur on, match:namespace ^(launcher|fuzzel)$
layerrule = ignore_alpha 0.2, match:namespace ^(launcher|fuzzel)$
layerrule = dim_around on, match:namespace ^(launcher)$
layerrule = animation popin 90%, match:namespace ^(launcher)$

# Los popouts acoplados (barra superior y lanzador inferior), notificaciones y OSD animan en QML:
# desactivar la animación del compositor evita saltos y doble animación.
# Los desplegables oscurecen el fondo sin blur (mismo efecto dim_around).
layerrule = no_anim on, match:namespace ^(quickshell-launcher|quickshell-notif-center|quickshell-dashboard|quickshell-power)$

layerrule = blur on, match:namespace ^(quickshell-notifications|quickshell-osd)$
layerrule = ignore_alpha 0.2, match:namespace ^(quickshell-notifications|quickshell-osd)$
layerrule = no_anim on, match:namespace ^(quickshell-notifications|quickshell-osd)$

layerrule = blur on, match:namespace ^(quickshell-overview)$
layerrule = ignore_alpha 0.2, match:namespace ^(quickshell-overview)$
layerrule = animation fade, match:namespace ^(quickshell-overview)$

dwindle {
    preserve_split = true
    smart_resizing = true
}

misc {
    vrr = 1
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    focus_on_activate = true
    animate_manual_resizes = true
    animate_mouse_windowdragging = true
    # XDG_CURRENT_DESKTOP se define como "Hyprland:GNOME" en env.conf (intencional,
    # para los portales de GNOME). Esto silencia el aviso de "gestionado externamente".
    disable_xdg_env_checks = true
}

input {
    kb_layout = latam
    kb_variant =
    kb_model = pc105
    kb_options =
    # NumLock encendido al iniciar la sesión (workspaces con el teclado numérico).
    numlock_by_default = true
    # Foco "loose": el puntero hace hover y scroll en la ventana bajo el cursor,
    # pero el foco de teclado solo cambia al hacer clic. Evita que los modales y
    # menús (DBeaver, fuzzel, diálogos XWayland) se cierren al mover el mouse.
    # float_switch_override_focus=0 impide el refoco forzado al cruzar entre una
    # ventana flotante (modal) y una en mosaico.
    follow_mouse = 2
    float_switch_override_focus = 0
    sensitivity = 0

    touchpad {
        natural_scroll = true
        tap-to-click = true
        tap-and-drag = true
        clickfinger_behavior = true
        disable_while_typing = true
        middle_button_emulation = false
    }
}

gestures {
    workspace_swipe_distance = 300
    workspace_swipe_invert = true
    workspace_swipe_min_speed_to_force = 30
    workspace_swipe_cancel_ratio = 0.5
    workspace_swipe_create_new = true
    workspace_swipe_direction_lock = true
    workspace_swipe_direction_lock_threshold = 10
    workspace_swipe_forever = true
}

# Gestos Touchpad estilo GNOME (Hyprland 0.55+)
# 3 dedos horizontal: cambio fluido 1:1 de escritorios (como en GNOME Shell)
gesture = 3, horizontal, workspace

# 3 dedos hacia arriba: lanzador unificado (Quickshell)
gesture = 3, up, dispatcher, exec, ~/.config/hypr/scripts/launcher-toggle.sh
# 3 dedos hacia abajo: overview tipo Activities (Quickshell)
gesture = 3, down, dispatcher, exec, ~/.config/hypr/scripts/overview-toggle.sh

cursor {
    # Deshabilita cursores por hardware: evita el flickeo del puntero en setups multi-GPU o salidas en NVIDIA/Nouveau
    no_hardware_cursors = true
    # Evita que Hyprland sobreescriba el tema de cursor de GNOME en GSettings/dconf al volver a GNOME.
    sync_gsettings_theme = false
}

# Colores activos del modo actual (dark / light)
source = ~/.config/hypr/conf/colors.conf
